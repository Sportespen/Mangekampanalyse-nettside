name: WA discovery check (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Find the real year-filter query param and check for a client API route
        run: |
          node <<'NODE'
          (async()=>{
            const id=14428253;
            const r=await fetch(`https://worldathletics.org/athletes/-/${id}`,{headers:{'User-Agent':'Mozilla/5.0'}});
            const html=await r.text();
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            const nextData=JSON.parse(html.slice(openEnd,closeIdx));
            console.log('nextData.query:', JSON.stringify(nextData.query));
            console.log('nextData.page:', nextData.page);
            console.log('buildId:', nextData.buildId);
            // Look for any hint of a year-select control or api route in the raw HTML
            const yearMatches = [...html.matchAll(/resultsByYear[^"'&=]*=[^"'&]*/gi)].map(m=>m[0]).slice(0,20);
            console.log('resultsByYear occurrences in HTML:', JSON.stringify([...new Set(yearMatches)]));
            const apiMatches = [...html.matchAll(/\/(?:api|graphql)[^"'\s)]{0,80}/gi)].map(m=>m[0]).slice(0,20);
            console.log('api/graphql-looking paths in HTML:', JSON.stringify([...new Set(apiMatches)]));
            // Try the Next.js data route directly (this is how client-side navigation refetches props)
            if(nextData.buildId){
              const dataUrl=`https://worldathletics.org/_next/data/${nextData.buildId}/en/athletes/-/${id}.json?resultsByYear=2025&urlSlug=-&id=${id}`;
              const r2=await fetch(dataUrl,{headers:{'User-Agent':'Mozilla/5.0',accept:'application/json'}});
              const t2=await r2.text();
              console.log('data route status:', r2.status, 'len', t2.length);
              try{
                const j2=JSON.parse(t2);
                const ry=j2?.pageProps?.competitor?.resultsByYear;
                console.log('data route resultsByYear.parameters:', JSON.stringify(ry?.parameters));
              }catch(e){ console.log('data route not JSON, first 300 chars:', t2.slice(0,300)); }
            }
          })();
          NODE
