name: WA discovery check (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check nimarion discovery + one athlete HTML profile shape
        run: |
          node <<'NODE'
          (async()=>{
            for (const url of ['https://worldathletics.nimarion.de/graphql/endpoint','https://worldathletics.nimarion.de/graphql/api-key']) {
              try{
                const r=await fetch(url,{headers:{accept:'application/json'}});
                const t=await r.text();
                console.log(url, r.status, t.slice(0,300));
              }catch(e){console.log(url,'ERROR',String(e.message||e));}
            }
            try{
              const r=await fetch('https://worldathletics.org/athletes/-/14173337',{headers:{'User-Agent':'Mozilla/5.0'}});
              const html=await r.text();
              console.log('profile status',r.status,'len',html.length);
              const marker='id="__NEXT_DATA__"';
              const idx=html.indexOf(marker);
              if(idx!==-1){
                const openEnd=html.indexOf('>',idx)+1;
                const closeIdx=html.indexOf('</script>',openEnd);
                const nextData=JSON.parse(html.slice(openEnd,closeIdx));
                const competitor=nextData?.props?.pageProps?.competitor;
                console.log('competitor top-level keys:', Object.keys(competitor||{}));
                for(const k of Object.keys(competitor||{})){
                  const v=competitor[k];
                  if(Array.isArray(v)) console.log(' -',k,'is array, len',v.length, v.length?JSON.stringify(v[0]).slice(0,300):'');
                  else if(v && typeof v==='object') console.log(' -',k,'is object, keys',Object.keys(v));
                }
              } else console.log('__NEXT_DATA__ not found');
            }catch(e){console.log('profile ERROR',String(e.message||e));}
          })();
          NODE
