name: WA discovery check (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump resultsByEvent disciplines for Pineau and Thiam
        run: |
          node <<'NODE'
          async function fetchCompetitor(id){
            const r=await fetch(`https://worldathletics.org/athletes/-/${id}`,{headers:{'User-Agent':'Mozilla/5.0'}});
            const html=await r.text();
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            if(idx===-1){ console.log(id,'status',r.status,'__NEXT_DATA__ not found'); return null; }
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            const nextData=JSON.parse(html.slice(openEnd,closeIdx));
            return nextData?.props?.pageProps?.competitor;
          }
          (async()=>{
            for(const [name,id] of [['Nafissatou Thiam',14428253],['Elisa Pineau',14624254]]){
              const c=await fetchCompetitor(id);
              const events=c?.resultsByYear?.resultsByEvent||[];
              console.log('---',name,id,'---');
              console.log('disciplines this season:', events.map(e=>e.discipline+' ('+(e.results||[]).length+')').join(', '));
              const spyd=events.find(e=>e.discipline==='Javelin Throw');
              const run800=events.find(e=>e.discipline==='800 Metres');
              console.log('Javelin Throw:', spyd?JSON.stringify(spyd.results):'NOT PRESENT');
              console.log('800 Metres:', run800?JSON.stringify(run800.results):'NOT PRESENT');
              console.log('seasonsBests keys check - activeSeasons:', JSON.stringify(c?.seasonsBests?.activeSeasons));
            }
          })();
          NODE
