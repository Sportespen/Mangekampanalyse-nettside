name: WA discovery check (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check nimarion discovery + one athlete HTML profile shape
        run: |
          node <<'NODE'
          (async()=>{
            for (const url of ['https://worldathletics.nimarion.de/graphql/endpoint','https://worldathletics.nimarion.de/graphql/api-key']) {
              try{
                const r=await fetch(url,{headers:{accept:'application/json'}});
                const t=await r.text();
                console.log(url, r.status, t.slice(0,300));
              }catch(e){console.log(url,'ERROR',String(e.message||e));}
            }
            async function fetchCompetitor(url){
              const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0'}});
              const html=await r.text();
              const marker='id="__NEXT_DATA__"';
              const idx=html.indexOf(marker);
              if(idx===-1){ console.log(url,'status',r.status,'__NEXT_DATA__ not found'); return null; }
              const openEnd=html.indexOf('>',idx)+1;
              const closeIdx=html.indexOf('</script>',openEnd);
              const nextData=JSON.parse(html.slice(openEnd,closeIdx));
              return nextData?.props?.pageProps?.competitor;
            }
            try{
              const competitor=await fetchCompetitor('https://worldathletics.org/athletes/-/14173337');
              const ry=competitor?.resultsByYear;
              console.log('resultsByYear.parameters:', JSON.stringify(ry?.parameters));
              console.log('resultsByYear.activeYears:', JSON.stringify(ry?.activeYears));
              const events=ry?.resultsByEvent||[];
              console.log('resultsByEvent count:', events.length);
              for(const ev of events.slice(0,3)){
                console.log('event:',ev.discipline,'results:',JSON.stringify(ev.results?.slice(0,3)));
              }
              const lj=events.find(e=>e.discipline==='Long Jump');
              console.log('Long Jump full:',JSON.stringify(lj));
            }catch(e){console.log('profile ERROR',String(e.message||e));}
            try{
              const competitor2025=await fetchCompetitor('https://worldathletics.org/athletes/-/14173337?resultsByYear=2025');
              console.log('with ?resultsByYear=2025 -> activeYears param used:', JSON.stringify(competitor2025?.resultsByYear?.parameters));
            }catch(e){console.log('year-query ERROR',String(e.message||e));}
          })();
          NODE
