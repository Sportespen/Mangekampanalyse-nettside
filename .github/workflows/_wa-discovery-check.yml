name: WA discovery check (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm women's eventGroup naming (try an active heptathlete)
        run: |
          node <<'NODE'
          async function fetchCompetitor(id){
            const r=await fetch(`https://worldathletics.org/athletes/-/${id}`,{headers:{'User-Agent':'Mozilla/5.0'}});
            const html=await r.text();
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            if(idx===-1) return null;
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            const nextData=JSON.parse(html.slice(openEnd,closeIdx));
            return nextData?.props?.pageProps?.competitor;
          }
          (async()=>{
            for(const [name,id] of [['Elisa Pineau',14624254],['Beatricke Juskeviciute',14632718],['Marie Dehning',14810666]]){
              const c=await fetchCompetitor(id);
              console.log(name, JSON.stringify(c?.worldRankings?.current?.map(x=>({eventGroup:x.eventGroup,place:x.place}))));
            }
          })();
          NODE
