name: WA discovery check (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect progressionOfSeasonsBests shape for Thiam Javelin/800m
        run: |
          node <<'NODE'
          async function fetchCompetitor(id){
            const r=await fetch(`https://worldathletics.org/athletes/-/${id}`,{headers:{'User-Agent':'Mozilla/5.0'}});
            const html=await r.text();
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            if(idx===-1) return null;
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            const nextData=JSON.parse(html.slice(openEnd,closeIdx));
            return nextData?.props?.pageProps?.competitor;
          }
          (async()=>{
            const c=await fetchCompetitor(14428253);
            const prog=c?.progressionOfSeasonsBests||[];
            const jav=prog.find(p=>p.discipline==='Javelin Throw');
            const run800=prog.find(p=>p.discipline==='800 Metres');
            console.log('Javelin Throw progression:', JSON.stringify(jav,null,1));
            console.log('800 Metres progression:', JSON.stringify(run800,null,1));
          })();
          NODE
