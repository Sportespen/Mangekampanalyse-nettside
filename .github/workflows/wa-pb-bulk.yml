name: WA PB bulk fetch
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wa-pb-bulk.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch World Athletics profiles
        run: |
          node <<'NODE'
          const fs = require('fs');
          const names = [
            'Johannes Erm','Sander Skotheim','Leo Neugebauer','Niklas Kaul',
            'Makenson Gletty','Sven Roosen','Karel Tilga','Tomas Järvinen',
            'Amadeus Gräber','Rasmus Roosleht','Dario Dester','Vilém Stráský',
            'Antoine Ferranti','Ondřej Kopecký','Andrin Huber','Risto Lillemets',
            'Jeff Tesselaar','Luuk Pelkmans','Edgaras Benkunskas','Dai Keïta',
            'Zsombor Gálpál','Nino Portmann','Alberto Nonino','Leon Krummenacher','Emil Uhlin'
          ];
          const base='https://worldathletics.nimarion.de';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function arr(x){
            if(Array.isArray(x)) return x;
            if(!x||typeof x!=='object') return [];
            for(const k of ['items','results','data','athletes']) if(Array.isArray(x[k])) return x[k];
            for(const v of Object.values(x)) if(Array.isArray(v)) return v;
            return [];
          }
          function athleteId(o){
            if(!o||typeof o!=='object') return null;
            for(const k of ['id','athleteId','aaId','competitorId']) if(o[k]!=null) return o[k];
            for(const [k,v] of Object.entries(o)) if(/id$/i.test(k)&&v!=null&&(typeof v==='string'||typeof v==='number')) return v;
            return null;
          }
          async function getJson(url){
            const r=await fetch(url,{headers:{'accept':'application/json','user-agent':'Mangekampanalyse-Pro/1.0'}});
            const text=await r.text();
            let body; try{body=JSON.parse(text)}catch{body={_raw:text}}
            if(!r.ok) throw new Error(`${r.status} ${url} ${text.slice(0,300)}`);
            return body;
          }
          (async()=>{
            const out={generatedAt:new Date().toISOString(),source:base,athletes:{}};
            for(const name of names){
              try{
                const search=await getJson(`${base}/athletes/search?name=${encodeURIComponent(name)}`);
                const list=arr(search);
                const first=list[0]||search?.[0]||null;
                const id=athleteId(first);
                let profile=null;
                if(id!=null) profile=await getJson(`${base}/athletes/${id}`);
                out.athletes[name]={id,search,profile};
              }catch(e){
                out.athletes[name]={error:String(e)};
              }
              await sleep(120);
            }
            fs.writeFileSync('app/data/wa_bulk_raw.json',JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit fetched data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/data/wa_bulk_raw.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fetch WA PB profiles for Birmingham men'
          git push
