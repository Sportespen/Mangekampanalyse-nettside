name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Inspect Pierce LePage's Høyde cell in the live browser DOM/state
        run: |
          cat > probe5.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            page.on('console', msg => console.log('[page]', msg.text()));
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.waitForTimeout(1500);
            const result = await page.evaluate(() => {
              const heightIndex = D.events.indexOf('Høyde');
              const a = (D.athletes || []).find(x => x.name && x.name.toLowerCase().includes('lepage'));
              if (!a) return { error: 'athlete not found', names: (D.athletes||[]).map(x=>x.name) };
              const out = {
                heightIndex,
                name: a.name,
                liveActual: a.liveActual,
                actual: a.actual,
                liveActive: a.liveActive,
                liveStatus: a.liveStatus,
                best: a.best,
                recent: a.recent && a.recent[heightIndex],
                combinedPB: a.combinedPB,
                theoreticalPB: a.theoreticalPB,
              };
              try { out.forecastBasisPrediction = typeof window.forecastBasisPrediction === 'function' ? window.forecastBasisPrediction(a, heightIndex) : 'N/A'; } catch(e) { out.forecastBasisPrediction = 'ERR:'+e.message; }
              try { out.predictFn = typeof predict === 'function' ? predict(a, heightIndex) : 'N/A'; } catch(e) { out.predictFn = 'ERR:'+e.message; }
              try { out.hasActualFn = typeof hasActual === 'function' ? hasActual(a, heightIndex) : 'N/A'; } catch(e) { out.hasActualFn = 'ERR:'+e.message; }
              try { out.actualMarkFn = typeof actualMark === 'function' ? actualMark(a, heightIndex) : 'N/A'; } catch(e) { out.actualMarkFn = 'ERR:'+e.message; }
              try { out.predictedMarkFn = typeof predictedMark === 'function' ? predictedMark(a, heightIndex) : 'N/A'; } catch(e) { out.predictedMarkFn = 'ERR:'+e.message; }
              return out;
            });
            console.log('=== RESULT ===');
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })();
          EOF
          node probe5.js
