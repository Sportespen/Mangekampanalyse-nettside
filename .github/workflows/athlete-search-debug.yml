name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Look for a static/public x-api-key embedded in WA's JS bundles
        run: |
          node <<'NODE'
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};
          async function fetchText(url){
            const r = await fetch(url, {headers: UA});
            const text = await r.text();
            return {status:r.status, text};
          }
          (async () => {
            const { text: html } = await fetchText('https://worldathletics.org/athletes-home?query=test');
            const scriptSrcs = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js)["']/gi)].map(m => m[1]);
            const nextStatic = [...new Set(scriptSrcs)].filter(s => s.includes('_next/static'));
            console.log('found', nextStatic.length, '_next/static script tags');
            for (const src of nextStatic) {
              const full = src.startsWith('http') ? src : `https://worldathletics.org${src.startsWith('/') ? '' : '/'}${src}`;
              console.log('\n=== fetching', full, '===');
              try {
                const { status, text: js } = await fetchText(full);
                console.log('status:', status, '| length:', js.length);
                // Look for any x-api-key header constant and nearby quoted value
                const idxs = [];
                let from = 0;
                while (true) {
                  const idx = js.indexOf('x-api-key', from);
                  if (idx === -1) break;
                  idxs.push(idx);
                  from = idx + 9;
                  if (idxs.length >= 5) break;
                }
                for (const idx of idxs) {
                  console.log('  context:', js.slice(Math.max(0, idx - 150), idx + 250));
                }
                // Also look for edge.aws.worldathletics.org occurrences (the GraphQL host)
                const hostIdx = js.indexOf('edge.aws.worldathletics.org');
                if (hostIdx !== -1) {
                  console.log('  edge.aws host context:', js.slice(Math.max(0, hostIdx - 200), hostIdx + 200));
                }
              } catch (e) {
                console.log('  ERROR:', e.message || String(e));
              }
            }
          })();
          NODE
