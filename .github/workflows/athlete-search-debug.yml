name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Long trace of women->men flip (40s, polling every 1s)
        run: |
          cat > trace_settype.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            page.on('console', msg => console.log('[page]', msg.text()));
            await page.addInitScript(() => {
              window.__setTypeCalls = [];
              window.__snapshots = [];
              let installed = false;
              const tryInstall = () => {
                if (installed) return;
                if (typeof window.setType !== 'function' || window.setType.__traced) return;
                installed = true;
                const real = window.setType;
                function traced(type) {
                  window.__setTypeCalls.push({ t: Date.now(), type, stack: new Error().stack });
                  return real.apply(this, arguments);
                }
                traced.__traced = true;
                window.setType = traced;
              };
              const poll = setInterval(tryInstall, 10);
              setTimeout(() => clearInterval(poll), 6000);
              // Also wrap setupAnalyseHeaders and reloadLiveData once available, to see if either
              // one fires again after initial load (which would rebuild the tab buttons / re-pull
              // the men/women switch state from scratch).
              window.__extraCalls = [];
              let installed2 = false;
              const tryInstall2 = () => {
                if (installed2) return;
                if (typeof window.setupAnalyseHeaders !== 'function') return;
                installed2 = true;
                const real2 = window.setupAnalyseHeaders;
                window.setupAnalyseHeaders = function () {
                  window.__extraCalls.push({ t: Date.now(), fn: 'setupAnalyseHeaders', stack: new Error().stack.split('\n').slice(0,4).join(' | ') });
                  return real2.apply(this, arguments);
                };
              };
              const poll2 = setInterval(tryInstall2, 10);
              setTimeout(() => clearInterval(poll2), 6000);
              // Snapshot currentType + active button every 1s so we can see exactly when (if ever)
              // it flips, independent of whether setType itself was called.
              const snap = setInterval(() => {
                try {
                  window.__snapshots.push({
                    t: Date.now(),
                    currentType: typeof currentType !== 'undefined' ? currentType : null,
                    activeBtn: document.querySelector('.event-switch-btn.active')?.dataset?.type || null,
                    firstName: document.querySelector('#liveForecastBody tr td.name')?.textContent || null
                  });
                } catch (_e) {}
              }, 1000);
              setTimeout(() => clearInterval(snap), 42000);
            });
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);
            await page.click('button.event-switch-btn[data-type="women"]');
            const clickAt = Date.now();
            console.log('CLICKED WOMEN AT', clickAt);
            await page.waitForTimeout(40000);
            const calls = await page.evaluate(() => window.__setTypeCalls || []);
            const extra = await page.evaluate(() => window.__extraCalls || []);
            const snaps = await page.evaluate(() => window.__snapshots || []);
            console.log('=== setType() CALL LOG ===');
            console.log(JSON.stringify(calls.map(c => ({ dt: c.t - clickAt, type: c.type, stack: c.stack.split('\n').slice(0,6).join(' | ') })), null, 2));
            console.log('=== setupAnalyseHeaders() CALL LOG ===');
            console.log(JSON.stringify(extra.map(c => ({ dt: c.t - clickAt, fn: c.fn, stack: c.stack })), null, 2));
            console.log('=== SNAPSHOTS (every 1s) ===');
            snaps.forEach(s => console.log(`dt=${s.t - clickAt}ms currentType=${s.currentType} activeBtn=${s.activeBtn} firstName=${s.firstName}`));
            await browser.close();
          })();
          EOF
          node trace_settype.js
