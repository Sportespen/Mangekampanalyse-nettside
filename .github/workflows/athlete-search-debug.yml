name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump full payload for women's Høyde event + all event statuses
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          API = "https://api.athle.matsport.com"
          COMP = "65e4f577-c90c-4008-9955-dfa3563d7a86"

          def get(path):
              req = urllib.request.Request(API + path, headers={
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 Mangekampanalyse/2.0",
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          comp = get(f"/competitions/{COMP}")
          schedules = comp.get("schedules", [])
          events = []
          for day in schedules:
              for ev in day.get("events", []):
                  events.append(ev)

          print("=== ALL EVENT STATUSES ===")
          for ev in events:
              print(ev.get("status"), "|", ev.get("phase"), "|", ev.get("gender"), "|", ev.get("id"))

          print("\n=== FULL PAYLOAD FOR WOMEN'S HØYDE (given event id) ===")
          eid = "65e4f577-c90c-4008-9955-dfa3563d7a86_ATSTAW700B02"
          payload = get(f"/events/{eid}")
          print(json.dumps(payload, ensure_ascii=False, indent=1)[:6000])
          EOF
