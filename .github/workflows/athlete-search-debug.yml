name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check decastar health now and confirm which JS version is served
        run: |
          echo "=== which live-refresh-api version does index.html reference right now? ==="
          curl -s "https://mangekampanalyse.no/?t=$(date +%s%N)" | grep -o 'live-refresh-api-fix20260918.js?v=[a-z0-9-]*'
          echo "=== does that exact file contain the Birmingham setInterval removal (only 1 setInterval call left)? ==="
          ver=$(curl -s "https://mangekampanalyse.no/?t=$(date +%s%N)" | grep -o 'live-refresh-api-fix20260918.js?v=[a-z0-9-]*' | head -1)
          curl -s "https://mangekampanalyse.no/$ver" -o /tmp/live-refresh.js
          echo "setInterval count: $(grep -o 'setInterval' /tmp/live-refresh.js | wc -l)"
          grep -o "window.setInterval([^;]*;" /tmp/live-refresh.js
          echo ""
          echo "=== live-decastar health, 6 polls @ 10s ==="
          for i in $(seq 1 6); do
            start=$(date +%s%N)
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 25 "https://mangekampanalyse.no/api/live-decastar?t=$(date +%s%N)")
            end=$(date +%s%N)
            ms=$(( (end - start) / 1000000 ))
            echo "poll $i @ $(date -u +%H:%M:%S) - HTTP $code - ${ms}ms"
            if [ "$code" != "200" ]; then
              echo "--- BODY ---"; cat /tmp/resp.json; echo "--- END ---"
            else
              python3 - <<'PYEOF'
          import json
          d=json.load(open('/tmp/resp.json'))
          print('  updatedAt:', d.get('updatedAt'), '| error:', d.get('error'))
          PYEOF
            fi
            sleep 10
          done
