name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Poll men's shot put (Kule) event(s) repeatedly to see update cadence and 'current' flag behaviour
        run: |
          cat > probe.py <<'EOF'
          import json, time, urllib.request

          API = 'https://api.athle.matsport.com'
          COMP = '65e4f577-c90c-4008-9955-dfa3563d7a86'
          HEADERS = {'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 Mangekampanalyse/2.0'}

          def get(path):
              req = urllib.request.Request(API + path, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))

          comp = get(f'/competitions/{COMP}')
          shot_put_ids = []
          for day in comp.get('schedules', []):
              for ev in day.get('events', []):
                  gender = str(ev.get('gender', '')).upper()
                  phase = str(ev.get('phase', '')) + ' ' + str(ev.get('event', ''))
                  if gender == 'M' and 'shot put' in phase.lower():
                      shot_put_ids.append((ev.get('id'), ev.get('phase'), ev.get('event')))

          print('=== Men Shot Put event IDs found ===')
          for eid, phase, event in shot_put_ids:
              print(eid, '|', phase, '|', event)
          print()

          for tick in range(10):
              now = time.strftime('%H:%M:%S')
              print(f'--- tick {tick} at {now} (elapsed {tick*6}s) ---')
              for eid, phase, event in shot_put_ids:
                  payload = get(f'/events/{eid}')
                  block = payload.get('horizontalResult') or {}
                  rows = block.get('results') or []
                  actives = []
                  for row in rows:
                      cur = str(row.get('current') or '').strip()
                      athlete = row.get('athlete') or {}
                      name = athlete.get('longName') or f"{athlete.get('forename','')} {athlete.get('name','')}"
                      status = row.get('status')
                      result = row.get('result')
                      if cur:
                          actives.append(f"{name.strip()} (current={cur!r} status={status!r} result={result!r})")
                  print(f'  event {eid} ({phase}): active_count={len(actives)}')
                  for a in actives:
                      print('    ACTIVE:', a)
              time.sleep(6)
          EOF
          python3 probe.py
