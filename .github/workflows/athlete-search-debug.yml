name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Verify Markus Rooth's dropdown shows a real value after the predict() fix
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2500);
            const result = await page.evaluate(async () => {
              const rows = [...document.querySelectorAll('#liveForecastBody tr')];
              const row = rows.find(r => r.querySelector('td.name')?.textContent?.trim() === 'Markus Rooth');
              const cell = row ? row.querySelector('.forecast-total-cell') : null;
              if (cell) cell.click();
              await new Promise(res => setTimeout(res, 400));
              return document.querySelector('.forecast-score-dropdown')?.innerText || null;
            });
            console.log('MARKUS DROPDOWN:', result);
            await browser.close();
          })();
          "
