name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check live-decastar API for women's Høyde
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar?t=$(date +%s%N)" -o /tmp/live.json
          echo "size: $(wc -c < /tmp/live.json)"
          python3 - <<'EOF'
          import json
          with open('/tmp/live.json') as f:
              data = json.load(f)
          sec = data.get('women', {})
          results = sec.get('results', {})
          print("completedEvents=", sec.get('completedEvents'))
          print("eventHasMarks=", sec.get('eventHasMarks'))
          print()
          for name, row in results.items():
              hoyde = row.get('Høyde')
              if hoyde:
                  print(name, '->', hoyde)
          EOF
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Check women's Høyde column in the live browser table
        run: |
          cat > check_hoyde.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.click('button.event-switch-btn[data-type="women"]');
            await page.waitForTimeout(800);
            await page.click('button.tab.feature-card[data-tab="forecast"]');
            await page.waitForTimeout(1500);
            const info = await page.evaluate(() => {
              const idx = D.events.indexOf('Høyde');
              const rows = [...document.querySelectorAll('#liveForecastBody tr')].map(tr => {
                const name = tr.querySelector('td.name')?.textContent?.trim();
                const cells = [...tr.querySelectorAll('td')];
                const cell = cells[3 + idx];
                return { name, cellText: cell?.textContent?.trim(), cellClass: cell?.className };
              });
              return { eventIndex: idx, rows };
            });
            console.log('=== WOMEN HØYDE COLUMN ===');
            console.log(JSON.stringify(info, null, 2));
            await browser.close();
          })();
          EOF
          node check_hoyde.js
