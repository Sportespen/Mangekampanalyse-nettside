name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check production live-decastar men+women over time
        run: |
          for i in 1 2 3; do
            echo "=== poll $i at $(date -u +%H:%M:%S) ==="
            curl -s "https://mangekampanalyse.no/api/live-decastar?t=$(date +%s%N)" -o /tmp/live_$i.json
            python3 - "$i" <<'PYEOF'
          import json,sys
          i=sys.argv[1]
          d=json.load(open(f'/tmp/live_{i}.json'))
          m=d.get('men',{})
          w=d.get('women',{})
          print("updatedAt:", d.get('updatedAt'))
          print("MEN completedEvents:", m.get('completedEvents'), "eventHasMarks:", m.get('eventHasMarks'))
          print("WOMEN completedEvents:", w.get('completedEvents'), "eventHasMarks:", w.get('eventHasMarks'))
          # Show Diskos detail for men to see if new marks are landing
          disc=[]
          for name, entry in m.get('results',{}).items():
              v=entry.get('Diskos')
              if v: disc.append((name, v.get('mark'), v.get('resultStatus'), v.get('active')))
          print("MEN Diskos rows:", len(disc))
          for r in sorted(disc, key=lambda x: (x[1] is None, x[1]), reverse=True)[:5]:
              print("   ", r)
          PYEOF
            if [ "$i" -lt 3 ]; then sleep 35; fi
          done
