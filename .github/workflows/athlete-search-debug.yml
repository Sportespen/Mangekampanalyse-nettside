name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Map Rooth's Talence 2026 disciplines to their eventId/competitionId
        timeout-minutes: 2
        run: |
          curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://worldathletics.org/athletes/norway/markus-rooth-14783534" -o /tmp/rooth.html
          python3 - <<'PYEOF'
          import json, re
          with open('/tmp/rooth.html', encoding='utf-8') as f:
              html = f.read()
          marker = 'id="__NEXT_DATA__"'
          idx = html.find(marker)
          open_tag_end = html.find('>', idx) + 1
          close_tag = html.find('</script>', open_tag_end)
          data = json.loads(html[open_tag_end:close_tag])

          def walk(obj, path=''):
              if isinstance(obj, dict):
                  if obj.get('discipline') and isinstance(obj.get('results'), list):
                      disc = obj['discipline']
                      for r in obj['results']:
                          comp = str(r.get('competition',''))
                          if 'calence' in comp.lower() or 'talence' in comp.lower() or 'castar' in comp.lower():
                              print(disc, '| eventId:', r.get('eventId'), '| competitionId:', r.get('competitionId'), '| date:', r.get('date'), '| mark:', r.get('mark'))
                  for k, v in obj.items():
                      walk(v, path+'/'+k)
              elif isinstance(obj, list):
                  for item in obj:
                      walk(item, path)

          walk(data)
          PYEOF
