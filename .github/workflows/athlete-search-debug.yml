name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test matsport upstream directly
        run: |
          echo "--- competition endpoint ---"
          curl -s -m 30 -o /tmp/comp.json -w "HTTP:%{http_code}\n" "https://api.athle.matsport.com/competitions/65e4f577-c90c-4008-9955-dfa3563d7a86"
          echo "--- first 2000 chars ---"
          head -c 2000 /tmp/comp.json
          echo ""
          echo "--- our own proxy again ---"
          curl -s -m 30 -o /tmp/ours.json -w "HTTP:%{http_code}\n" "https://mangekampanalyse.no/api/live-decastar"
          cat /tmp/ours.json
