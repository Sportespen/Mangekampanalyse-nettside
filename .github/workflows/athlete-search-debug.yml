name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Direct curl check of app-fix20260918.js
        run: |
          curl -sI "https://mangekampanalyse.no/app-fix20260918.js"
          echo "---"
          curl -s "https://mangekampanalyse.no/app-fix20260918.js" -o /tmp/a.js
          echo "size: $(wc -c < /tmp/a.js)"
          grep -o "function predict([^}]*}" /tmp/a.js
          echo "---"
          echo "checking response headers with cache bust:"
          curl -sI "https://mangekampanalyse.no/app-fix20260918.js?x=$(date +%s%N)"
