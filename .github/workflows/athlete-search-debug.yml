name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify /api/live-decastar finds all disciplines after schedules-field fix
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar" | node -e "
            let data='';
            process.stdin.on('data',c=>data+=c);
            process.stdin.on('end',()=>{
              const d=JSON.parse(data);
              console.log('status:', d.status, '| error:', d.error||'(none)');
              console.log('men.eventHasMarks:', JSON.stringify(d.men?.eventHasMarks));
              console.log('women.eventHasMarks:', JSON.stringify(d.women?.eventHasMarks));
              console.log('men result count:', Object.keys(d.men?.results||{}).length);
              console.log('women result count:', Object.keys(d.women?.results||{}).length);
            });
          "
