name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Cloudflare Access protects /stats and /api/stats but not /api/track
        timeout-minutes: 2
        run: |
          for site in "https://mangekampanalyse.no" "https://rankingstevner.no"; do
            echo "=== $site ==="
            echo "--- POST /api/track (should stay 204, public) ---"
            curl -s -m 15 -o /dev/null -w "HTTP %{http_code}\n" -X POST "$site/api/track"
            echo "--- GET /stats.html (should now be blocked/redirected, not 200 with real content) ---"
            curl -s -m 15 -o /dev/null -w "HTTP %{http_code} -> %{redirect_url}\n" "$site/stats.html"
            echo "--- GET /api/stats (should now be blocked, not raw JSON) ---"
            curl -s -m 15 -w "\nHTTP %{http_code}\n" "$site/api/stats?nocache=$(date +%s)" | head -c 400
            echo
          done
