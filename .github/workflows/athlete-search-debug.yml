name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Wrap forecastBasisPrediction after load and click Markus's row
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2500);

            const result = await page.evaluate(async () => {
              const calls = [];
              const orig = window.forecastBasisPrediction;
              window.forecastBasisPrediction = function(a, i) {
                const r = orig(a, i);
                calls.push({ name: a && a.name, i, event: (typeof D !== 'undefined' ? D.events[i] : '?'), result: r });
                return r;
              };

              const before = document.querySelectorAll('.forecast-score-dropdown').length;
              const rows = [...document.querySelectorAll('#liveForecastBody tr')];
              const row = rows.find(r => r.querySelector('td.name')?.textContent?.trim() === 'Markus Rooth');
              const cell = row ? row.querySelector('.forecast-total-cell') : null;
              const foundRow = !!row, foundCell = !!cell;
              if (cell) cell.click();
              await new Promise(res => setTimeout(res, 400));
              const after = document.querySelectorAll('.forecast-score-dropdown').length;
              const dropdownText = document.querySelector('.forecast-score-dropdown')?.innerText || null;

              window.forecastBasisPrediction = orig;
              return { foundRow, foundCell, before, after, calls, dropdownText };
            });
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })();
          "
