name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Broad search of matsport.com app.js for API call patterns
        run: |
          node <<'NODE'
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};
          async function fetchText(url){
            const r = await fetch(url, { headers: UA });
            return await r.text();
          }
          function contexts(text, needle, radius, max) {
            const out = [];
            let from = 0;
            for (let i = 0; i < max; i++) {
              const idx = text.indexOf(needle, from);
              if (idx === -1) break;
              out.push(text.slice(Math.max(0, idx - radius), idx + needle.length + radius));
              from = idx + needle.length;
            }
            return out;
          }
          (async () => {
            const app = await fetchText('https://athle.matsport.com/js/app.2b846e41.js');
            console.log('app.js length:', app.length);
            for (const needle of ['/api', 'axios', 'matsport.com', 'baseURL', 'VUE_APP', 'process.env', 'wss://', 'socket.io', 'graphql']) {
              const found = contexts(app, needle, 60, 5);
              console.log(`\n--- "${needle}": ${found.length} occurrence(s) shown ---`);
              for (const c of found) console.log('  ', JSON.stringify(c));
            }
          })();
          NODE
