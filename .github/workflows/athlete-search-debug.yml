name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check for any currently-active athlete in production data
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar?t=$(date +%s%N)" -o /tmp/live.json
          python3 - <<'EOF'
          import json
          with open('/tmp/live.json') as f:
              data = json.load(f)
          found = False
          for section in ['men', 'women']:
              sec = data.get(section, {})
              results = sec.get('results', {})
              for name, row in results.items():
                  for ev, entry in row.items():
                      if isinstance(entry, dict) and entry.get('active'):
                          print(f"ACTIVE: {section} {name} {ev} -> {entry}")
                          found = True
          if not found:
              print("No athlete currently flagged active (nobody mid-attempt right now)")
          EOF
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Verify the live-now CSS/markup exists structurally
        run: |
          cat > verify_live_now.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.click('button.tab.feature-card[data-tab="forecast"]');
            await page.waitForTimeout(1500);
            const info = await page.evaluate(() => {
              const style = [...document.styleSheets].some(() => true);
              const hasLiveNowRule = document.querySelector('#forecast-dropdown-style')?.textContent.includes('live-now-icon');
              const activeCells = document.querySelectorAll('.live-now').length;
              const activeIcons = document.querySelectorAll('.live-now-icon').length;
              return { hasLiveNowRule, activeCells, activeIcons };
            });
            console.log('=== LIVE-NOW STRUCTURAL CHECK ===');
            console.log(JSON.stringify(info, null, 2));
            await browser.close();
          })();
          EOF
          node verify_live_now.js
