name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Watch production for JS errors and check women highlight
        run: |
          node - <<'NODEEOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('PAGEERROR: ' + e.message + '\n' + (e.stack||'')));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('CONSOLE: ' + msg.text()); });
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2000);

            const snap = async (label) => {
              const data = await page.evaluate(() => {
                const status = document.querySelector('.status')?.textContent || '';
                const banner = document.querySelector('#forecastBanner')?.textContent || '';
                const latestCells = [...document.querySelectorAll('#liveForecastBody td.latest-result')].length;
                const rowsCount = document.querySelectorAll('#liveForecastBody tr').length;
                return { status, banner, latestCells, rowsCount };
              });
              console.log(`=== ${label} ===`);
              console.log(JSON.stringify(data, null, 2));
              return data;
            };

            await snap('men - t=0s');
            await page.waitForTimeout(32000);
            await snap('men - t=32s (after 1 poll)');

            // switch to women's tab
            const switched = await page.evaluate(() => {
              const btn = document.querySelector('.event-switch-btn[data-type="women"]');
              if (btn) { btn.click(); return true; }
              return false;
            });
            console.log('switched to women tab:', switched);
            await page.waitForTimeout(1000);
            await snap('women - right after tab switch');
            await page.waitForTimeout(32000);
            await snap('women - t=32s after switch (after 1 more poll)');

            console.log('=== JS errors captured ===');
            console.log(errors.length ? errors.join('\n---\n') : '(none)');
            await browser.close();
          })();
          NODEEOF
