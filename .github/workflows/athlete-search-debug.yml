name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect initialSearchResults inside __NEXT_DATA__
        run: |
          node <<'NODE'
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};
          async function fetchText(url){
            const r = await fetch(url, {headers: UA});
            const text = await r.text();
            return {status:r.status, text};
          }
          function extractNextData(html){
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            if(idx===-1) return null;
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            try{ return JSON.parse(html.slice(openEnd,closeIdx)); }catch(e){ return null; }
          }
          (async () => {
            for (const q of ['Jonathan Hertwig', 'Hertwig', 'Karsten Warholm']) {
              const url = `https://worldathletics.org/athletes-home?query=${encodeURIComponent(q)}`;
              console.log('\n\n=== ' + url + ' ===');
              const { status, text } = await fetchText(url);
              console.log('HTTP status:', status, '| HTML length:', text.length);
              const nextData = extractNextData(text);
              const results = nextData?.props?.pageProps?.initialSearchResults;
              console.log('typeof initialSearchResults:', typeof results, Array.isArray(results) ? `(array len ${results.length})` : '');
              console.log('initialSearchResults raw (first 4000 chars):', JSON.stringify(results, null, 2)?.slice(0, 4000));
            }
          })();
          NODE
