name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Playwright
        run: |
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Verify final Decastar results show up for both competitions
        timeout-minutes: 3
        run: |
          cat > check.mjs << 'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();
          const consoleMsgs = [];
          page.on('console', msg => consoleMsgs.push(`[${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => consoleMsgs.push(`[pageerror] ${err.message}`));

          try {
            await page.goto('https://mangekampanalyse.no/?verify=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 20000 });
            await page.waitForTimeout(2500);
            await page.click('button[data-tab="forecast"]').catch(()=>{});
            await page.waitForTimeout(1000);

            async function dump(label) {
              const banner = await page.$eval('#forecastBanner', el => el.textContent).catch(()=>'NO BANNER');
              const pill = await page.$eval('#forecastLivePill', el => el.textContent).catch(()=>'NO PILL');
              const rowCount = await page.$$eval('#liveForecastBody tr', rows => rows.length).catch(()=>-1);
              const firstRowCells = await page.$$eval('#liveForecastBody tr:first-child td', tds => tds.slice(0,8).map(td => td.textContent.trim())).catch(()=>[]);
              console.log(`--- ${label} ---`);
              console.log('BANNER:', banner);
              console.log('PILL:', pill);
              console.log('ROWS:', rowCount);
              console.log('FIRST ROW CELLS:', JSON.stringify(firstRowCells));
            }

            await page.selectOption('#competitionSelect', 'decastar').catch(()=>{});
            await page.waitForTimeout(1000);
            await dump('Decastar');

            await page.selectOption('#competitionSelect', 'birmingham').catch(()=>{});
            await page.waitForTimeout(1000);
            await dump('Birmingham');
          } catch (e) {
            console.log('SCRIPT ERROR:', e.message);
          }

          console.log('--- console/page errors (all) ---');
          for (const m of consoleMsgs) console.log(m);

          await browser.close();
          EOF
          timeout 150 node check.mjs || echo "NODE SCRIPT TIMED OUT OR FAILED, exit=$?"
