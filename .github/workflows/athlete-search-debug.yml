name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Reproduce the actual click flow for Sander Skotheim and Markus Rooth (fresh session)
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('console.error: ' + msg.text()); });
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2500);

            async function readDropdownFor(name) {
              const clicked = await page.evaluate((name) => {
                const rows = [...document.querySelectorAll('#liveForecastBody tr')];
                const row = rows.find(r => r.querySelector('td.name')?.textContent?.trim() === name);
                if (!row) return { ok: false, reason: 'row not found', names: rows.map(r=>r.querySelector('td.name')?.textContent?.trim()) };
                const cell = row.querySelector('.forecast-total-cell');
                if (!cell) return { ok: false, reason: 'total cell not found' };
                cell.click();
                return { ok: true };
              }, name);
              if (!clicked.ok) return clicked;
              await page.waitForTimeout(300);
              const text = await page.evaluate(() => document.querySelector('.forecast-score-dropdown')?.innerText || null);
              return { ok: true, dropdownText: text };
            }

            const sander = await readDropdownFor('Sander Skotheim');
            const markus = await readDropdownFor('Markus Rooth');

            console.log('SANDER:', JSON.stringify(sander, null, 2));
            console.log('MARKUS:', JSON.stringify(markus, null, 2));
            console.log('PAGE ERRORS:', JSON.stringify(errors, null, 2));

            // also check script src actually served to this fresh session
            const scriptSrcs = await page.evaluate(() => [...document.scripts].map(s=>s.src).filter(s=>s.includes('forecast-enhancements')||s.includes('live-engine')));
            console.log('SCRIPT SRCS:', JSON.stringify(scriptSrcs, null, 2));

            await browser.close();
          })();
          "
