name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check the combined-events-tour meet listing page for Decastar 2026's id
        run: |
          curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" \
            "https://worldathletics.org/competitions/world-athletics-combined-events-tour/calendar-results/7171048/result" \
            -o /tmp/tour.html
          wc -c /tmp/tour.html
          python3 - <<'PYEOF'
          import json, re
          with open('/tmp/tour.html', encoding='utf-8') as f:
              html = f.read()
          marker = 'id="__NEXT_DATA__"'
          idx = html.find(marker)
          if idx == -1:
              print('NO __NEXT_DATA__ FOUND')
          else:
              open_tag_end = html.find('>', idx) + 1
              close_tag = html.find('</script>', open_tag_end)
              text = html[open_tag_end:close_tag]
              # Dump full text to a file for a broader grep, and print any mention of Talence/Decastar
              with open('/tmp/tour_next_data.json', 'w', encoding='utf-8') as out:
                  out.write(text)
              for m in re.finditer(r'.{80}([Dd].castar|Talence).{200}', text):
                  print(m.group(0))
                  print('---')
          PYEOF
          echo "--- grep for competitionId near Decastar/Talence mentions ---"
          grep -o '.\{0,50\}[Tt]alence.\{0,50\}' /tmp/tour_next_data.json | head -20
          grep -o '"id":[0-9]*,"name":"[^"]*"' /tmp/tour_next_data.json | grep -i 'decastar\|talence' | head -20
