name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Inspect forecast panel for both competitions
        run: |
          cat > check.mjs << 'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();
          const consoleMsgs = [];
          page.on('console', msg => consoleMsgs.push(`[${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => consoleMsgs.push(`[pageerror] ${err.message}`));

          await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 30000 });
          await page.click('button[data-tab="forecast"]').catch(()=>{});
          await page.waitForTimeout(1500);

          async function dump(label) {
            const banner = await page.$eval('#forecastBanner', el => el.textContent).catch(()=>'NO BANNER');
            const pill = await page.$eval('#forecastLivePill', el => el.textContent).catch(()=>'NO PILL');
            const rowCount = await page.$$eval('#liveForecastBody tr', rows => rows.length).catch(()=>-1);
            console.log(`--- ${label} ---`);
            console.log('BANNER:', banner);
            console.log('PILL:', pill);
            console.log('ROWS:', rowCount);
          }

          const opts = await page.$$eval('#competitionSelect option', os => os.map(o=>({value:o.value,text:o.textContent}))).catch(()=>null);
          console.log('OPTIONS:', JSON.stringify(opts));

          await dump('initial (default competition)');

          if (opts) {
            for (const o of opts) {
              await page.selectOption('#competitionSelect', o.value).catch(()=>{});
              await page.waitForTimeout(1500);
              await dump('after selecting ' + o.text);
            }
          }

          console.log('--- console/page errors (all) ---');
          for (const m of consoleMsgs) console.log(m);

          await browser.close();
          EOF
          node check.mjs
