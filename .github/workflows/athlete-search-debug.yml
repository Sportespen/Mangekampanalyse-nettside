name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Shot Put and Long Jump result structure
        run: |
          set +e
          BASE="https://api-history.athle.matsport.com"
          for EID in \
            "e0c02ff7-1fa5-4d8f-bda9-dae5888883cd_ATSTAM900C00" \
            "e0c02ff7-1fa5-4d8f-bda9-dae5888883cd_ATSTAM900B01"
          do
            echo "=== $EID ==="
            curl -s "$BASE/events/$EID" -H "Accept: application/json" -o /tmp/f.json
            node -e "
              const d=JSON.parse(require('fs').readFileSync('/tmp/f.json','utf8'));
              console.log('phase:', d.phase, '| status:', d.status);
              console.log('keys:', Object.keys(d));
              console.log('engaged length:', (d.engaged||[]).length);
              console.log('horizontalResult:', JSON.stringify(d.horizontalResult)?.slice(0,2500));
            "
            echo ""
          done
