name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect decastar.fr results page and WA search __NEXT_DATA__
        run: |
          echo "--- decastar.fr/en/results full content (iframe/links) ---"
          curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://decastar.fr/en/results" -o /tmp/results.html
          grep -oE '(iframe[^>]*src="[^"]*"|href="[^"]*"|worldathletics[^"'"'"'<> ]*|matsport[^"'"'"'<> ]*)' /tmp/results.html | sort -u | head -60
          echo "--- WA search page __NEXT_DATA__ ---"
          curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://worldathletics.org/search?query=decastar%202026" -o /tmp/search.html
          python3 - <<'PYEOF'
          import json, re
          with open('/tmp/search.html', encoding='utf-8') as f:
              html = f.read()
          marker = 'id="__NEXT_DATA__"'
          idx = html.find(marker)
          if idx == -1:
              print('NO __NEXT_DATA__ on search page')
          else:
              open_tag_end = html.find('>', idx) + 1
              close_tag = html.find('</script>', open_tag_end)
              text = html[open_tag_end:close_tag]
              ids = sorted(set(re.findall(r'"competitionId"\s*:\s*(\d+)', text)))
              print('competitionIds found:', ids)
              names = re.findall(r'"name"\s*:\s*"([^"]*[Dd][ée]castar[^"]*)"', text)
              print('names:', sorted(set(names)))
              print(text[:3000])
          PYEOF
