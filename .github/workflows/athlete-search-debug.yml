name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Find Décastar men's Long Jump event id(s) and dump raw horizontalResult row
        run: |
          BASE="https://api.athle.matsport.com"
          COMP="65e4f577-c90c-4008-9955-dfa3563d7a86"
          curl -s "$BASE/competitions/$COMP" -H "Accept: application/json" -o /tmp/comp.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/comp.json','utf8'));
            const schedules = d.schedules||[];
            const ids=[];
            for(const day of schedules){for(const ev of (day.events||[])){if(ev.gender==='M' && /long jump/i.test(ev.phase||'')){ids.push(ev.id);console.log(JSON.stringify({id:ev.id,phase:ev.phase,status:ev.status}));}}}
            require('fs').writeFileSync('/tmp/ids.json', JSON.stringify(ids));
          "
          for EID in $(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/ids.json')).join(' '))"); do
            echo "=== $EID ==="
            curl -s "$BASE/events/$EID" -H "Accept: application/json" -o /tmp/ev.json
            node -e "
              const d=JSON.parse(require('fs').readFileSync('/tmp/ev.json','utf8'));
              console.log('status:', d.status);
              const rows = d.horizontalResult?.results||[];
              console.log('row count:', rows.length);
              const withMark = rows.filter(r=>r.result);
              console.log('rows with a result:', withMark.length);
              if (withMark[0]) console.log('first row with result:', JSON.stringify(withMark[0], null, 2));
            "
          done
