name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check current live status and any active athlete
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar?t=$(date +%s%N)" -o /tmp/live.json
          python3 - <<'EOF'
          import json
          with open('/tmp/live.json') as f:
              data = json.load(f)
          print("status:", data.get("status"), "updatedAt:", data.get("updatedAt"))
          found = False
          for section in ['men', 'women']:
              sec = data.get(section, {})
              print(f"=== {section} === completedEvents={sec.get('completedEvents')} eventHasMarks={sec.get('eventHasMarks')}")
              results = sec.get('results', {})
              for name, row in results.items():
                  for ev, entry in row.items():
                      if isinstance(entry, dict) and entry.get('active'):
                          print(f"ACTIVE: {section} {name} {ev} -> {entry}")
                          found = True
          if not found:
              print("No athlete currently flagged active by the organiser's API right now")
          EOF
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Check women's table for live-now markers and poll interval
        run: |
          cat > check_live_now2.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.click('button.event-switch-btn[data-type="women"]');
            await page.waitForTimeout(800);
            await page.click('button.tab.feature-card[data-tab="forecast"]');
            await page.waitForTimeout(1500);
            const info = await page.evaluate(() => {
              const activeCells = document.querySelectorAll('.live-now').length;
              const activeIcons = document.querySelectorAll('.live-now-icon').length;
              const anyLiveActiveFlag = (D.athletes || []).some(a => (a.liveActive||[]).some(Boolean));
              const script = [...document.querySelectorAll('script[src]')].map(s => s.src).find(s => s.includes('live-engine'));
              return { activeCells, activeIcons, anyLiveActiveFlag, liveEngineScript: script };
            });
            console.log('=== WOMEN LIVE-NOW CHECK ===');
            console.log(JSON.stringify(info, null, 2));
            const src = await page.evaluate(async () => {
              const r = await fetch(document.querySelector('script[src*="live-engine"]').src, { cache: 'no-store' });
              const t = await r.text();
              const idx = t.indexOf('setInterval(reloadLiveData');
              return t.slice(idx, idx + 60);
            });
            console.log('=== SERVED live-engine INTERVAL LINE ===');
            console.log(src);
            await browser.close();
          })();
          EOF
          node check_live_now2.js
