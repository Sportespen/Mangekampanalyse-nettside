name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify v2 analyse now returns pbs/combinedPB for Jonathan
        run: |
          set -x
          curl -s "https://mangekampanalyse.no/api/athlete-search-v2?action=analyse&type=men&id=14989292&name=Jonathan%20Hertwig-Odegaard" | head -c 3000
          echo
          echo
          echo "=== Markus Rooth (v2), sanity check ==="
          curl -s "https://mangekampanalyse.no/api/athlete-search-v2?action=analyse&type=men&id=14783534&name=Markus%20Rooth" | head -c 2000
