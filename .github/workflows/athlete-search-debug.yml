name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify wind now appears in live-decastar API output
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar" -o /tmp/live.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/live.json','utf8'));
            console.log('status:', d.status, '| error:', d.error||'(none)');
            const men=d.men?.results||{};
            const sample=Object.entries(men).slice(0,3);
            console.log('sample men 100m rows (with wind):', JSON.stringify(sample.map(([name,row])=>({name,wind:row['100m']?.wind,mark:row['100m']?.mark})), null, 2));
          "
