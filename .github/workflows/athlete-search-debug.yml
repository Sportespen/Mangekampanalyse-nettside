name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Poll live-decastar and live (Birmingham) every 10s, check for failures
        run: |
          for i in $(seq 1 8); do
            for path in "live-decastar" "live"; do
              start=$(date +%s%N)
              code=$(curl -s -o /tmp/resp_$path.json -w "%{http_code}" --max-time 25 "https://mangekampanalyse.no/api/$path?t=$(date +%s%N)")
              end=$(date +%s%N)
              ms=$(( (end - start) / 1000000 ))
              echo "[$path] poll $i @ $(date -u +%H:%M:%S) - HTTP $code - ${ms}ms"
              if [ "$code" != "200" ]; then
                echo "--- BODY ($path) ---"
                cat /tmp/resp_$path.json
                echo "--- END ---"
              else
                python3 - "$path" <<'PYEOF'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(f'/tmp/resp_{p}.json'))
          print(f'  [{p}] updatedAt:', d.get('updatedAt'), '| error:', d.get('error'))
          PYEOF
              fi
            done
            sleep 8
          done
