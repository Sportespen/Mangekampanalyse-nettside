name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Find WA links on decastar.fr and try WA competition search
        run: |
          echo "--- decastar.fr results/live page, look for worldathletics.org links ---"
          curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://decastar.fr/en/" -o /tmp/decastar_home.html
          grep -o 'worldathletics\.org[^"'"'"']*' /tmp/decastar_home.html | sort -u | head -20
          echo "--- try a few likely results/live subpages ---"
          for path in "en/results" "en/live" "resultats" "en/2026" "en/the-meeting"; do
            echo "== $path =="
            curl -s -m 15 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://decastar.fr/$path" -o /tmp/p.html
            wc -c /tmp/p.html
            grep -o 'worldathletics\.org[^"'"'"']*' /tmp/p.html | sort -u | head -10
          done
          echo "--- WA global search API attempt ---"
          curl -s -m 15 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://worldathletics.org/search?query=decastar" -o /tmp/search.html
          wc -c /tmp/search.html
          grep -o 'calendar-results/results/[0-9]*' /tmp/search.html | sort -u | head -20
