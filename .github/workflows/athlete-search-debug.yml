name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Load Décastar page and probe forecastBasisPrediction for Markus Rooth
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('console.error: ' + msg.text()); });
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2000);
            const result = await page.evaluate(() => {
              const athlete = (D?.athletes || []).find(a => a.name === 'Markus Rooth');
              if (!athlete) return { error: 'athlete not found in D.athletes', currentComp: typeof currentComp !== 'undefined' ? currentComp : 'undefined', athleteNames: (D?.athletes||[]).map(a=>a.name) };
              const events = D.events;
              const perEvent = events.map((e, i) => {
                let pred = null, err = null;
                try { pred = typeof window.forecastBasisPrediction === 'function' ? window.forecastBasisPrediction(athlete, i) : 'fn missing'; }
                catch (ex) { err = String(ex); }
                return { event: e, pred, err };
              });
              return {
                currentComp: typeof currentComp !== 'undefined' ? currentComp : 'undefined',
                athleteFound: true,
                perEvent,
                hasForecastBasisPrediction: typeof window.forecastBasisPrediction === 'function'
              };
            });
            console.log(JSON.stringify(result, null, 2));
            console.log('PAGE ERRORS:', JSON.stringify(errors, null, 2));
            await browser.close();
          })();
          "
