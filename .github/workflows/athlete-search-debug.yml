name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the fix is actually served from production
        run: |
          echo "=== fetching live-refresh-api-fix20260918.js?v=20260919-livefix13 ==="
          curl -sI "https://mangekampanalyse.no/live-refresh-api-fix20260918.js?v=20260919-livefix13"
          echo "---"
          curl -s "https://mangekampanalyse.no/live-refresh-api-fix20260918.js?v=20260919-livefix13" -o /tmp/live-refresh.js
          echo "size: $(wc -c < /tmp/live-refresh.js)"
          echo "=== does it contain the onBirmingham guard? ==="
          grep -o "onBirmingham" /tmp/live-refresh.js | head -5
          echo "=== does index.html reference livefix13? ==="
          curl -s "https://mangekampanalyse.no/?t=$(date +%s%N)" | grep -o 'live-refresh-api-fix20260918.js?v=[a-z0-9-]*'
