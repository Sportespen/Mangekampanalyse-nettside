name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Re-check production search for Markus Rooth, twice
        run: |
          set -x
          for i in 1 2; do
            echo "=== attempt $i ==="
            curl -s "https://mangekampanalyse.no/api/athlete-search?action=search&type=men&q=Markus%20Rooth"
            echo
            sleep 2
          done
          echo "=== analyse directly by id (bypasses search) ==="
          curl -s "https://mangekampanalyse.no/api/athlete-search?action=analyse&type=men&id=14783534&name=Markus%20Rooth" | head -c 2000
