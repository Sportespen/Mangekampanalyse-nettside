name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Trap every GET access to window.forecastBasisPrediction during the click
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2500);

            const result = await page.evaluate(async () => {
              const gets = [];
              let realFn = window.forecastBasisPrediction;
              try {
                Object.defineProperty(window, 'forecastBasisPrediction', {
                  configurable: true,
                  get() { gets.push({ stack: new Error().stack.split('\n').slice(1,4).join(' | ') }); return realFn; },
                  set(v) { realFn = v; }
                });
              } catch (e) { return { trapError: String(e) }; }

              // sanity checks
              const typeofNow = typeof window.forecastBasisPrediction;
              const predictSrc = String(window.predict || (typeof predict !== 'undefined' ? predict : 'predict not global'));

              const rows = [...document.querySelectorAll('#liveForecastBody tr')];
              const row = rows.find(r => r.querySelector('td.name')?.textContent?.trim() === 'Markus Rooth');
              const cell = row ? row.querySelector('.forecast-total-cell') : null;
              if (cell) cell.click();
              await new Promise(res => setTimeout(res, 400));

              const dropdownText = document.querySelector('.forecast-score-dropdown')?.innerText || null;

              // restore
              delete window.forecastBasisPrediction;
              window.forecastBasisPrediction = realFn;

              return { typeofNow, predictSrc, getsCount: gets.length, gets: gets.slice(0,5), dropdownText };
            });
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })();
          "
