name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Map Thiam's Talence 2026 women's disciplines to their eventIds
        timeout-minutes: 2
        run: |
          curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://worldathletics.org/athletes/belgium/nafissatou-thiam-14428253" -o /tmp/thiam.html
          python3 - <<'PYEOF'
          import json
          with open('/tmp/thiam.html', encoding='utf-8') as f:
              html = f.read()
          marker = 'id="__NEXT_DATA__"'
          idx = html.find(marker)
          open_tag_end = html.find('>', idx) + 1
          close_tag = html.find('</script>', open_tag_end)
          data = json.loads(html[open_tag_end:close_tag])

          seen = set()
          def walk(obj):
              if isinstance(obj, dict):
                  if obj.get('discipline') and isinstance(obj.get('results'), list):
                      disc = obj['discipline']
                      for r in obj['results']:
                          comp = str(r.get('competition',''))
                          eid = r.get('eventId')
                          if ('castar' in comp.lower() or 'talence' in comp.lower()) and eid:
                              key = (disc, eid)
                              if key not in seen:
                                  seen.add(key)
                                  print(disc, '| eventId:', eid, '| date:', r.get('date'), '| mark:', r.get('mark'))
                  for v in obj.values():
                      walk(v)
              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)

          walk(data)
          PYEOF
