name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump raw trackResult row for men's 100m to find the wind field name
        run: |
          BASE="https://api.athle.matsport.com"
          EID="65e4f577-c90c-4008-9955-dfa3563d7a86_ATSTAM900A01"
          curl -s "$BASE/events/$EID" -H "Accept: application/json" -o /tmp/f.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/f.json','utf8'));
            console.log('top-level keys:', Object.keys(d));
            console.log('trackResult keys:', Object.keys(d.trackResult||{}));
            const rows = d.trackResult?.results||[];
            console.log('row count:', rows.length);
            if(rows[0]) console.log('first row full:', JSON.stringify(rows[0], null, 2));
          "
