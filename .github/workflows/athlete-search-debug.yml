name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Find the "current" field value for the athlete currently in action
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          API = "https://api.athle.matsport.com"

          def get(path):
              req = urllib.request.Request(API + path, headers={
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 Mangekampanalyse/2.0",
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          eid = "65e4f577-c90c-4008-9955-dfa3563d7a86_ATSTAW700B02"
          payload = get(f"/events/{eid}")
          print("=== TOP-LEVEL PAYLOAD KEYS AND SCALAR VALUES ===")
          for k, v in payload.items():
              if not isinstance(v, (dict, list)):
                  print(f"  {k!r}: {v!r}")
          block = payload.get("verticalResult") or {}
          print("\n=== verticalResult TOP-LEVEL KEYS ===")
          for k, v in block.items():
              if k != "results":
                  print(f"  {k!r}: {v!r}" if not isinstance(v, list) else f"  {k!r}: <list of {len(v)}>")
          results = block.get("results") or []
          print(f"\n{len(results)} athletes - FULL ROW for Celia PERRON and Vanessa GRIMM:\n")
          for row in results:
              name = row.get("athlete", {}).get("longName")
              if name in ("Celia PERRON", "Vanessa GRIMM", "Noor VIDTS"):
                  print(name, "->", json.dumps({k: v for k, v in row.items() if k != "attemptVertical"}, ensure_ascii=False))
                  print("  attemptVertical:", json.dumps(row.get("attemptVertical"), ensure_ascii=False))
          EOF
