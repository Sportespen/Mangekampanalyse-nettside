name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch High Jump verticalResult structure
        run: |
          set +e
          BASE="https://api-history.athle.matsport.com"
          EID="e0c02ff7-1fa5-4d8f-bda9-dae5888883cd_ATSTAM900D01"
          curl -s "$BASE/events/$EID" -H "Accept: application/json" -o /tmp/f.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/f.json','utf8'));
            console.log('phase:', d.phase, '| status:', d.status, '| type:', d.type);
            console.log('verticalResult:', JSON.stringify(d.verticalResult)?.slice(0,3000));
          "
