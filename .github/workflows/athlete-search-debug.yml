name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check live-decastar at competition start
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar" -o /tmp/live.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/live.json','utf8'));
            console.log('status:', d.status, '| error:', d.error||'(none)');
            console.log('men.eventHasMarks:', JSON.stringify(d.men?.eventHasMarks));
            console.log('women.eventHasMarks:', JSON.stringify(d.women?.eventHasMarks));
            console.log('men result count:', Object.keys(d.men?.results||{}).length);
            console.log('women result count:', Object.keys(d.women?.results||{}).length);
            const menResults = d.men?.results||{};
            const sample = Object.entries(menResults).slice(0,3);
            console.log('sample men rows:', JSON.stringify(sample, null, 2));
          "
      - name: Also hit raw matsport 100m event directly (ground truth)
        run: |
          curl -s "https://api.athle.matsport.com/competitions/65e4f577-c90c-4008-9955-dfa3563d7a86" -H "Accept: application/json" -o /tmp/comp.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/comp.json','utf8'));
            const schedules = d.schedules||[];
            let found=null;
            for(const day of schedules){for(const ev of (day.events||[])){if(ev.gender==='M' && /100/i.test(ev.phase||'')){found=ev;break;}}if(found)break;}
            console.log('found 100m event:', JSON.stringify(found));
          "
