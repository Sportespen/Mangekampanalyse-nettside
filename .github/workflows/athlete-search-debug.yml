name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Jonathan 400m now includes all 5 results, incl. PB
        run: |
          curl -s "https://mangekampanalyse.no/api/athlete-search-v2?action=analyse&type=men&id=14989292&name=Jonathan%20Hertwig-Odegaard" | node -e "
            let data='';
            process.stdin.on('data',c=>data+=c);
            process.stdin.on('end',()=>{
              const d=JSON.parse(data);
              console.log('400m rows:', JSON.stringify(d.events?.['400m'], null, 2));
              console.log('400m PB:', JSON.stringify(d.pbs?.['400m']));
            });
          "
