name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Try the discovered matsport API base against known page paths
        run: |
          node <<'NODE'
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0', 'Accept':'application/json'};
          const COMP = '65e4f577-c90c-4008-9955-dfa3563d7a86';
          async function tryUrl(url) {
            try {
              const r = await fetch(url, { headers: UA });
              const text = await r.text();
              console.log('\n===', url, '===');
              console.log('status:', r.status, 'content-type:', r.headers.get('content-type'), '| length:', text.length);
              console.log('body (first 800 chars):', text.slice(0, 800));
            } catch (e) {
              console.log('\n===', url, '=== ERROR:', e.message);
            }
          }
          (async () => {
            await tryUrl(`https://api.athle.matsport.com/events/${COMP}_ATSTAM900A01/classement`);
            await tryUrl(`https://api.athle.matsport.com/competitions/${COMP}`);
            await tryUrl(`https://api.athle.matsport.com/competitions/${COMP}/${COMP}_SCH_20260918`);
            await tryUrl(`https://api.athle.matsport.com/events/${COMP}_ATSTAM900A01`);
          })();
          NODE
