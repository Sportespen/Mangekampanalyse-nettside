name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Click Sander Skotheim's Lengde cell and read the attempt modal
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2500);
            const result = await page.evaluate(async () => {
              const scriptSrcs = [...document.scripts].map(s=>s.src).filter(s=>s.includes('live-'));
              const rows = [...document.querySelectorAll('#liveForecastBody tr')];
              const row = rows.find(r => r.querySelector('td.name')?.textContent?.trim() === 'Sander Skotheim');
              if (!row) return { scriptSrcs, error: 'row not found' };
              const cells = [...row.cells];
              const lengdeIdx = D.events.indexOf('Lengde');
              const cell = cells[3 + lengdeIdx];
              const hasActualClass = cell?.classList.contains('actual');
              cell?.click();
              await new Promise(res => setTimeout(res, 400));
              const modalText = document.querySelector('#modalContent')?.innerText || null;
              return { scriptSrcs, hasActualClass, modalText };
            });
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })();
          "
