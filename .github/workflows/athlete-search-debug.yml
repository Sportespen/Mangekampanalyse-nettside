name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump actual response headers and content hash for app.js
        run: |
          echo "=== HEAD request headers ==="
          curl -sI "https://mangekampanalyse.no/app.js"
          echo ""
          echo "=== fetch and check for the fix string ==="
          curl -s "https://mangekampanalyse.no/app.js" -o /tmp/app.js
          echo "file size: $(wc -c < /tmp/app.js)"
          echo "contains forecastBasisPrediction fallback:"
          grep -c "forecastBasisPrediction" /tmp/app.js || echo 0
          echo "=== md5 ==="
          md5sum /tmp/app.js
          echo ""
          echo "=== also check cf-cache-status header specifically ==="
          curl -sI "https://mangekampanalyse.no/app.js" | grep -i "cf-cache-status\|cache-control\|age:\|etag\|last-modified"
