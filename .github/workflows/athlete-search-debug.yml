name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Markus Rooth worldRankings + retest production endpoint
        run: |
          node <<'NODE'
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};
          (async () => {
            const r = await fetch('https://worldathletics.org/athletes/-/14783534', { headers: UA });
            const html = await r.text();
            const idx = html.indexOf('id="__NEXT_DATA__"');
            const openEnd = html.indexOf('>', idx) + 1;
            const closeIdx = html.indexOf('</script>', openEnd);
            const nextData = JSON.parse(html.slice(openEnd, closeIdx));
            const competitor = nextData?.props?.pageProps?.competitor;
            console.log('basicData:', JSON.stringify(competitor?.basicData, null, 2));
            console.log('\nworldRankings.current:', JSON.stringify(competitor?.worldRankings?.current, null, 2));
            console.log('\nresultsByYear.resultsByEvent (full):', JSON.stringify(competitor?.resultsByYear?.resultsByEvent, null, 2));
          })();
          NODE
          echo "=== retest production analyse endpoint (delayed retry) ==="
          curl -s -w "\nHTTP status: %{http_code}\n" "https://mangekampanalyse.no/api/athlete-search?action=analyse&type=men&id=14783534&name=Markus%20Rooth" | head -c 2500
          echo
          echo "=== retest production search endpoint (delayed retry) ==="
          curl -s -w "\nHTTP status: %{http_code}\n" "https://mangekampanalyse.no/api/athlete-search?action=search&type=men&q=Markus%20Rooth"
