name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Watch production forecast table for JS errors and freezing
        run: |
          node - <<'NODEEOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('PAGEERROR: ' + e.message));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('CONSOLE: ' + msg.text()); });
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2000);
            const snap = async () => {
              return await page.evaluate(() => {
                const status = document.querySelector('.status')?.textContent || '';
                const banner = document.querySelector('#forecastBanner')?.textContent || '';
                const rowsCount = document.querySelectorAll('#liveForecastBody tr').length;
                const firstRow = document.querySelector('#liveForecastBody tr')?.textContent?.slice(0,200) || '';
                return { status, banner, rowsCount, firstRow, mangekampLiveDecastar: !!window.MANGEKAMP_LIVE_DECASTAR, updatedAt: window.MANGEKAMP_LIVE_DECASTAR?.updatedAt };
              });
            };
            console.log('=== snapshot 1 (t=0s) ===');
            console.log(JSON.stringify(await snap(), null, 2));
            await page.waitForTimeout(35000);
            console.log('=== snapshot 2 (t=35s, after one 30s poll cycle) ===');
            console.log(JSON.stringify(await snap(), null, 2));
            await page.waitForTimeout(35000);
            console.log('=== snapshot 3 (t=70s) ===');
            console.log(JSON.stringify(await snap(), null, 2));
            console.log('=== JS errors captured ===');
            console.log(errors.length ? errors.join('\n') : '(none)');
            await browser.close();
          })();
          NODEEOF
