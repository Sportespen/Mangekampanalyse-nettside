name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect the WA athletes-home search page structure
        run: |
          node <<'NODE'
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};
          async function fetchText(url){
            const r = await fetch(url, {headers: UA});
            const text = await r.text();
            return {status:r.status, text};
          }
          (async () => {
            for (const q of ['Jonathan Hertwig', 'Hertwig', 'jonathan']) {
              const url = `https://worldathletics.org/athletes-home?query=${encodeURIComponent(q)}`;
              console.log('\n=== ' + url + ' ===');
              const { status, text } = await fetchText(url);
              console.log('HTTP status:', status, '| HTML length:', text.length);
              const rx = /href=["'](?:https:\/\/worldathletics\.org)?\/athletes\/([^\/"']+)\/([^"']+?)-(\d{7,})["']/gi;
              const matches = [...text.matchAll(rx)].slice(0, 10);
              console.log('regex athlete-link matches found:', matches.length);
              for (const m of matches) console.log('  ', m[0]);
              console.log('contains "14989292" (Jonathan\'s id) anywhere:', text.includes('14989292'));
              console.log('contains "Hertwig" anywhere:', text.includes('Hertwig') || text.includes('HERTWIG'));
              const nextDataIdx = text.indexOf('id="__NEXT_DATA__"');
              console.log('has __NEXT_DATA__:', nextDataIdx !== -1);
              if (nextDataIdx !== -1) {
                const openEnd = text.indexOf('>', nextDataIdx) + 1;
                const closeIdx = text.indexOf('</script>', openEnd);
                try {
                  const nextData = JSON.parse(text.slice(openEnd, closeIdx));
                  console.log('nextData.props.pageProps keys:', Object.keys(nextData?.props?.pageProps || {}));
                  console.log('nextData.page:', nextData?.page, '| query:', JSON.stringify(nextData?.query));
                } catch (e) {
                  console.log('failed to parse __NEXT_DATA__:', e.message);
                }
              }
            }
          })();
          NODE
