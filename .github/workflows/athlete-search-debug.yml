name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check 110mh completeness - our API vs raw matsport, all heats
        run: |
          cat > probe_final.py <<'EOF'
          import json, time
          import urllib.request

          def get_json(url):
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 Mangekampanalyse/2.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode('utf-8'))

          print('=== Our own /api/live-decastar - men 110mh ===')
          live = get_json('https://mangekampanalyse.no/api/live-decastar?nocache=' + str(time.time()))
          men = live.get('men', {}).get('results', {})
          print('updatedAt:', live.get('updatedAt'), '| status:', live.get('status'))
          have = {n: e.get('110mh') for n, e in men.items() if e.get('110mh')}
          missing = [n for n in men if not men[n].get('110mh')]
          print(f'have 110mh: {len(have)} of {len(men)}')
          print('MISSING (no 110mh field at all):', missing)
          for n, v in have.items():
              print(f'  {n}: mark={v.get("mark")} display={v.get("display")} active={v.get("active")} status={v.get("status")}')

          print()
          print('=== Raw matsport - all 3 men 110mh heats, full roster per heat ===')
          API = 'https://api.athle.matsport.com'
          COMP = '65e4f577-c90c-4008-9955-dfa3563d7a86'
          def mget(path):
              req = urllib.request.Request(API + path, headers={'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 Mangekampanalyse/2.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))
          comp = mget(f'/competitions/{COMP}')
          hurdle_ids = []
          for day in comp.get('schedules', []):
              for ev in day.get('events', []):
                  phase = str(ev.get('phase','')) + ' ' + str(ev.get('event',''))
                  if str(ev.get('gender','')).upper()=='M' and 'hurdle' in phase.lower():
                      hurdle_ids.append((ev.get('id'), phase, ev.get('status')))
          for eid, phase, status in hurdle_ids:
              payload = mget(f'/events/{eid}')
              rows = (payload.get('trackResult') or {}).get('results') or []
              print(f'--- {phase} (status={status}) - {len(rows)} rows ---')
              for row in rows:
                  athlete = row.get('athlete') or {}
                  name = (athlete.get('longName') or '').strip()
                  print(f'    {name}: time={row.get("time")!r} status={row.get("status")!r} current={row.get("current")!r}')
          EOF
          python3 probe_final.py
