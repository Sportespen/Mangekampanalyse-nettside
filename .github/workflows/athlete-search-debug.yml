name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Verify score dropdown closes when clicking inside it
        run: |
          cat > verify_close.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.click('button.tab.feature-card[data-tab="forecast"]');
            await page.waitForTimeout(1500);
            const cell = await page.$('.forecast-total-cell');
            if (!cell) { console.log('No .forecast-total-cell found'); await browser.close(); return; }
            await cell.click();
            await page.waitForTimeout(600);
            const opened = await page.$('.forecast-score-dropdown');
            console.log('=== AFTER FIRST CLICK ===');
            console.log(opened ? 'OPENED' : 'DID NOT OPEN');
            if (opened) {
              await opened.click({ position: { x: 5, y: 5 } });
              await page.waitForTimeout(500);
              const stillOpen = await page.$('.forecast-score-dropdown');
              console.log('=== AFTER CLICKING INSIDE THE DROPDOWN ===');
              console.log(stillOpen ? 'STILL OPEN (bug)' : 'CLOSED (fixed)');
            }
            await browser.close();
          })();
          EOF
          node verify_close.js
