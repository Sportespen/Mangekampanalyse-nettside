name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Verify score dropdown highlights the total cell
        run: |
          cat > verify_highlight.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.click('button.tab.feature-card[data-tab="forecast"]');
            await page.waitForTimeout(1500);
            const cell = await page.$('.forecast-total-cell');
            if (!cell) { console.log('No .forecast-total-cell found'); await browser.close(); return; }
            await cell.click();
            await page.waitForTimeout(600);
            const info = await cell.evaluate(el => ({
              inlineStyle: el.getAttribute('style'),
              computedBg: getComputedStyle(el).backgroundColor,
              computedColor: getComputedStyle(el).color,
              computedBoxShadow: getComputedStyle(el).boxShadow,
              html: el.outerHTML
            }));
            console.log('=== TOTAL CELL STATE AFTER CLICK ===');
            console.log(JSON.stringify(info, null, 2));
            const dropdown = await page.$('.forecast-score-dropdown');
            console.log('=== DROPDOWN PRESENT ===');
            console.log(dropdown ? 'YES' : 'NO');
            if (dropdown) {
              const nameHeader = await dropdown.evaluate(el => el.querySelector('b')?.textContent || null);
              console.log('=== DROPDOWN NAME HEADER ===');
              console.log(nameHeader);
            }
            await browser.close();
          })();
          EOF
          node verify_highlight.js
