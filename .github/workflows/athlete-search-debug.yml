name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Load page and watch for JS errors / unexpected reloads over 70s
        run: |
          node - <<'NODEEOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            let navCount = 0;
            page.on('pageerror', e => errors.push('PAGEERROR: ' + e.message));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('CONSOLE: ' + msg.text()); });
            page.on('load', () => { navCount++; });
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'networkidle', timeout: 60000 });
            const build = await page.evaluate(() => document.querySelector('meta[name="mka-build"]')?.content);
            console.log('mka-build on load:', build, '| nav count after initial load:', navCount);
            await page.waitForTimeout(70000);
            console.log('nav count after 70s wait (should still be 1, since no new deploy landed):', navCount);
            console.log('=== JS errors captured ===');
            console.log(errors.length ? errors.join('\n---\n') : '(none)');
            await browser.close();
          })();
          NODEEOF
