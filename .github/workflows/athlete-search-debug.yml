name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check 400m data - our API vs raw matsport
        run: |
          cat > probe7.py <<'EOF'
          import json, time
          import urllib.request

          def get_json(url):
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 Mangekampanalyse/2.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))

          print('=== Our own /api/live-decastar - men 400m field presence ===')
          live = get_json('https://mangekampanalyse.no/api/live-decastar?nocache=' + str(time.time()))
          men = live.get('men', {}).get('results', {})
          with400 = {n: e.get('400m') for n, e in men.items() if e.get('400m')}
          print(f'men with 400m data: {len(with400)} of {len(men)} total athletes')
          for n, v in list(with400.items())[:5]:
              print(' ', n, v)
          print('men.eventHasMarks:', live.get('men', {}).get('eventHasMarks'))

          print()
          print('=== Raw matsport schedule - find 400m men event(s) ===')
          API = 'https://api.athle.matsport.com'
          COMP = '65e4f577-c90c-4008-9955-dfa3563d7a86'
          def mget(path):
              req = urllib.request.Request(API + path, headers={'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 Mangekampanalyse/2.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))
          comp = mget(f'/competitions/{COMP}')
          m400_ids = []
          for day in comp.get('schedules', []):
              for ev in day.get('events', []):
                  if str(ev.get('gender','')).upper()=='M' and '400' in (str(ev.get('phase',''))+str(ev.get('event',''))):
                      m400_ids.append((ev.get('id'), ev.get('phase'), ev.get('event'), ev.get('status')))
          print('Found men 400m-ish events (raw phase/event names):')
          for eid, phase, event, status in m400_ids:
              print(' ', eid, '| phase=', phase, '| event=', event, '| status=', status)

          print()
          print('=== Raw event payload for each matched 400m event ===')
          for eid, phase, event, status in m400_ids:
              payload = mget(f'/events/{eid}')
              track = payload.get('trackResult') or {}
              rows = track.get('results') or []
              print(f'--- event {eid} ({phase} / {event}) — {len(rows)} rows in trackResult.results ---')
              for row in rows[:3]:
                  athlete = row.get('athlete') or {}
                  name = (athlete.get('longName') or '').strip()
                  print('   ', name, '| time=', row.get('time'), '| status=', row.get('status'), '| current=', row.get('current'))
          EOF
          python3 probe7.py
