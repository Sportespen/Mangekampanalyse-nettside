name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Find Decastar Talence 2026 competitionId via Markus Rooth's WA profile
        run: |
          curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" "https://worldathletics.org/athletes/norway/markus-rooth-14783534" -o /tmp/rooth.html
          wc -c /tmp/rooth.html
          python3 - <<'PYEOF'
          import json, re
          with open('/tmp/rooth.html', encoding='utf-8') as f:
              html = f.read()
          marker = 'id="__NEXT_DATA__"'
          idx = html.find(marker)
          if idx == -1:
              print('NO __NEXT_DATA__ FOUND')
          else:
              open_tag_end = html.find('>', idx) + 1
              close_tag = html.find('</script>', open_tag_end)
              text = html[open_tag_end:close_tag]
              with open('/tmp/rooth_next_data.json', 'w', encoding='utf-8') as out:
                  out.write(text)
              print('dumped', len(text), 'bytes')
              # Look for anything mentioning Talence or Decastar with a nearby numeric id
              for m in re.finditer(r'.{150}(Talence|[Dd].castar).{200}', text):
                  print(m.group(0))
                  print('---')
          PYEOF
          echo "--- grep for competitionId near Talence/Decastar ---"
          grep -o '"competitionId":[0-9]*' /tmp/rooth_next_data.json | sort -u | head -20
          grep -o '.\{0,80\}Talence.\{0,80\}' /tmp/rooth_next_data.json | head -10
