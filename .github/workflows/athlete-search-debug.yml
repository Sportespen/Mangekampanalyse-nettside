name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: DNS + reachability checks
        run: |
          echo "--- general DNS sanity ---"
          getent hosts worldathletics.org || echo "worldathletics.org: FAIL"
          echo "--- graphql host ---"
          getent hosts graphql-prod-4881.edge.aws.worldathletics.org || echo "graphql-prod-4881.edge.aws.worldathletics.org: FAIL"
          echo "--- curl worldathletics.org ---"
          curl -s -m 15 -o /dev/null -w "HTTP:%{http_code}\n" "https://worldathletics.org/" || echo "curl failed"
          echo "--- curl graphql host (GET, expect 4xx not DNS error) ---"
          curl -s -m 15 -o /dev/null -w "HTTP:%{http_code}\n" "https://graphql-prod-4881.edge.aws.worldathletics.org/graphql" || echo "curl failed"
