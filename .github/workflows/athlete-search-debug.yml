name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Playwright
        run: |
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Capture the real error thrown by syncLive() on Decastar
        timeout-minutes: 3
        run: |
          cat > check.mjs << 'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();
          const consoleMsgs = [];
          page.on('console', msg => consoleMsgs.push(`[${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => consoleMsgs.push(`[pageerror] ${err.message}`));

          try {
            await page.goto('https://mangekampanalyse.no/', { waitUntil: 'domcontentloaded', timeout: 20000 });
            await page.waitForTimeout(2000);
            await page.click('button[data-tab="forecast"]').catch(()=>{});
            await page.waitForTimeout(500);

            // Switch to decastar first via the normal path (may leave things broken)
            await page.selectOption('#competitionSelect', 'decastar').catch(()=>{});
            await page.waitForTimeout(500);

            // Now call syncLive() directly and capture any thrown error with its stack
            const result = await page.evaluate(() => {
              try {
                window.syncLive();
                return { ok: true };
              } catch (e) {
                return { ok: false, message: e.message, stack: e.stack };
              }
            });
            console.log('DIRECT syncLive() RESULT:', JSON.stringify(result, null, 2));

            const banner = await page.$eval('#forecastBanner', el => el.textContent).catch(()=>'NO BANNER');
            console.log('BANNER AFTER DIRECT CALL:', banner);
          } catch (e) {
            console.log('SCRIPT ERROR:', e.message);
          }

          console.log('--- console/page errors (all) ---');
          for (const m of consoleMsgs) console.log(m);

          await browser.close();
          EOF
          timeout 150 node check.mjs || echo "NODE SCRIPT TIMED OUT OR FAILED, exit=$?"
