name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify /api/live-decastar structurally works on production
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar" | node -e "
            let data='';
            process.stdin.on('data',c=>data+=c);
            process.stdin.on('end',()=>{
              try {
                const d=JSON.parse(data);
                console.log('competition:', d.competition, '| status:', d.status, '| updatedAt:', d.updatedAt);
                console.log('men.completedEvents:', d.men?.completedEvents, '| men result count:', Object.keys(d.men?.results||{}).length);
                console.log('women.completedEvents:', d.women?.completedEvents, '| women result count:', Object.keys(d.women?.results||{}).length);
                console.log('men.eventHasMarks:', JSON.stringify(d.men?.eventHasMarks));
                console.log('women.eventHasMarks:', JSON.stringify(d.women?.eventHasMarks));
                if (d.error) console.log('ERROR:', d.error);
              } catch (e) {
                console.log('PARSE FAILED, raw body:', data.slice(0, 1000));
              }
            });
          "
