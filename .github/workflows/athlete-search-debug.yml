name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live production athlete-search API for Jonathan Hertwig-Ødegaard
        run: |
          set -x
          echo "=== search (type=men) ==="
          curl -s "https://mangekampanalyse.no/api/athlete-search?action=search&type=men&q=Jonathan%20Hertwig" | tee /tmp/search.json
          echo
          echo "=== search (type=men, q=Markus Rooth, sanity check known-good athlete) ==="
          curl -s "https://mangekampanalyse.no/api/athlete-search?action=search&type=men&q=Markus%20Rooth" | tee /tmp/search2.json
