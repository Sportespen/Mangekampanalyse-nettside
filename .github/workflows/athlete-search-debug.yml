name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the exact deployed originalTotal function source
        run: |
          curl -s "https://mangekampanalyse.no/forecast-enhancements.js?bust=$(date +%s)" -o /tmp/fe.js
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('/tmp/fe.js', 'utf8');
            const idx = src.indexOf('function originalTotal');
            console.log('originalTotal found at index:', idx);
            console.log(src.slice(idx, idx + 400));
            console.log('---');
            const idx2 = src.indexOf('function show(cell,a)');
            console.log('show found at index:', idx2);
            console.log(src.slice(idx2, idx2 + 300));
          "
