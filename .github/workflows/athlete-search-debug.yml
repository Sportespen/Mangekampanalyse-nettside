name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect matsport.com app bundle for its API base URL
        run: |
          node <<'NODE'
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};
          async function fetchText(url){
            const r = await fetch(url, { headers: UA });
            const text = await r.text();
            return { status: r.status, text };
          }
          (async () => {
            for (const path of ['/js/app.2b846e41.js', '/js/chunk-vendors.618dd592.js', '/js/runtime.e0760ed2.js']) {
              const url = 'https://athle.matsport.com' + path;
              console.log('\n=== ' + url + ' ===');
              const { status, text } = await fetchText(url);
              console.log('status:', status, '| length:', text.length);
              // look for API base URLs, "baseURL", "axios", env-style config
              const patterns = [
                /https?:\/\/[a-z0-9.-]*api[a-z0-9.-]*\/[a-z0-9\/_-]*/gi,
                /baseURL["':\s]{1,5}["']([^"']+)["']/gi,
                /VUE_APP_[A-Z_]+["':\s]{1,5}["']([^"']+)["']/gi,
              ];
              for (const rx of patterns) {
                const matches = [...text.matchAll(rx)].map(m => m[0]);
                if (matches.length) console.log('matches for', rx.source.slice(0,40), ':', JSON.stringify([...new Set(matches)].slice(0, 15), null, 2));
              }
            }
          })();
          NODE
