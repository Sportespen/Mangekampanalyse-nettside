name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Verify Markus Rooth's original forecast in a real browser
        run: |
          cat > verify_markus.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.click('button.tab.feature-card[data-tab="forecast"]');
            await page.waitForTimeout(1500);
            const rows = await page.$$('#liveForecastBody tr');
            let found = false;
            for (const row of rows) {
              const nameCell = await row.$('td.name');
              if (!nameCell) continue;
              const name = (await nameCell.textContent() || '').trim();
              if (!name.toLowerCase().includes('rooth')) continue;
              found = true;
              const totalCell = await row.$('.forecast-total-cell');
              if (totalCell) await totalCell.click();
              await page.waitForTimeout(800);
              const dropdownText = await page.textContent('.forecast-score-dropdown').catch(() => null);
              console.log('=== MARKUS ROOTH SCORE DROPDOWN ===');
              console.log(dropdownText || '(dropdown not found)');
            }
            if (!found) console.log('Markus Rooth row not found in forecast table');
            await browser.close();
          })();
          EOF
          node verify_markus.js
      - name: Check attempts for all field events (not just Lengde)
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar?t=$(date +%s%N)" -o /tmp/live.json
          echo "size: $(wc -c < /tmp/live.json)"
          python3 - <<'EOF'
          import json
          with open('/tmp/live.json') as f:
              data = json.load(f)
          for section in ['men', 'women']:
              sec = data.get(section, {})
              results = sec.get('results', {})
              print(f"=== {section} === completedEvents={sec.get('completedEvents')} eventHasMarks={sec.get('eventHasMarks')}")
              per_event = {}
              for name, row in results.items():
                  for ev, entry in row.items():
                      if not isinstance(entry, dict):
                          continue
                      per_event.setdefault(ev, {'total':0,'withAttempts':0,'sample':None})
                      per_event[ev]['total'] += 1
                      atts = entry.get('attempts') or []
                      if atts:
                          per_event[ev]['withAttempts'] += 1
                          if per_event[ev]['sample'] is None:
                              per_event[ev]['sample'] = (name, entry.get('attemptMode'), atts)
              for ev, stat in per_event.items():
                  print(f"  {ev}: {stat['withAttempts']}/{stat['total']} rows have attempts")
                  if stat['sample']:
                      name, mode, atts = stat['sample']
                      print(f"    sample ({name}, mode={mode}): {atts}")
          EOF
