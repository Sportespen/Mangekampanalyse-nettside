name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Final verification - Jonathan Hertwig and Markus Rooth on production
        run: |
          set -x
          echo "=== Jonathan Hertwig ==="
          curl -s -w "\nHTTP status: %{http_code}\n" "https://mangekampanalyse.no/api/athlete-search?action=search&type=men&q=Jonathan%20Hertwig"
          echo
          echo "=== Markus Rooth ==="
          curl -s -w "\nHTTP status: %{http_code}\n" "https://mangekampanalyse.no/api/athlete-search?action=search&type=men&q=Markus%20Rooth"
          echo
          echo "=== Markus Rooth analyse by id ==="
          curl -s -w "\nHTTP status: %{http_code}\n" "https://mangekampanalyse.no/api/athlete-search?action=analyse&type=men&id=14783534&name=Markus%20Rooth" | head -c 2000
