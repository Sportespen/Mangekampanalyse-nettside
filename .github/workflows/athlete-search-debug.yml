name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Watch a real browser session for 70s, capturing fetch failures / console errors / status changes
        run: |
          cat > probe_live_watch.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const events = [];
            const t0 = Date.now();
            const log = (kind, detail) => events.push({ t: Date.now() - t0, kind, detail });

            page.on('console', msg => { if (msg.type() === 'error' || msg.type() === 'warning') log('console', msg.type() + ': ' + msg.text()); });
            page.on('pageerror', e => log('pageerror', String(e)));
            page.on('requestfailed', req => log('requestfailed', req.url() + ' :: ' + (req.failure()?.errorText || 'unknown')));
            page.on('response', async res => {
              const url = res.url();
              if (url.includes('/api/live')) {
                log('response', `${res.status()} ${url}`);
              }
            });

            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            log('loaded', 'page loaded');

            for (let i = 0; i < 7; i++) {
              await page.waitForTimeout(10000);
              const statusText = await page.evaluate(() => document.querySelector('.status')?.textContent || 'NO STATUS BOX');
              const statusClasses = await page.evaluate(() => document.querySelector('.status')?.className || '');
              log('status-snapshot', JSON.stringify({ statusText, statusClasses }));
            }

            console.log('=== EVENT LOG ===');
            events.forEach(e => console.log(`[t=${e.t}ms] ${e.kind}: ${e.detail}`));
            await browser.close();
          })();
          EOF
          node probe_live_watch.js
