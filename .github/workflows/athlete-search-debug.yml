name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Compare current Birmingham vs Decastar proxy behavior
        run: |
          echo "--- Birmingham /api/live ---"
          curl -s -m 20 -o /tmp/birmingham.json -w "HTTP:%{http_code}\n" "https://mangekampanalyse.no/api/live"
          head -c 600 /tmp/birmingham.json
          echo ""
          echo "--- Decastar /api/live-decastar ---"
          curl -s -m 20 -o /tmp/decastar.json -w "HTTP:%{http_code}\n" "https://mangekampanalyse.no/api/live-decastar"
          head -c 600 /tmp/decastar.json
