name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check both /api/live and /api/live-decastar health right now, and deployed button code
        run: |
          cat > probe_health.py <<'EOF'
          import json, time
          import urllib.request, urllib.error

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 Mangekampanalyse/2.0'})
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode('utf-8'), time.time() - t0
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace'), time.time() - t0
              except Exception as e:
                  return None, str(e), time.time() - t0

          print('=== /api/live (Birmingham) ===')
          status, body, dt = get('https://mangekampanalyse.no/api/live?t=' + str(time.time()))
          print(f'status={status} took={dt:.2f}s bodylen={len(body)}')
          try:
              data = json.loads(body)
              print('  updatedAt:', data.get('updatedAt'), 'error:', data.get('error'))
          except Exception:
              print('  RAW (first 400 chars):', body[:400])

          print()
          print('=== /api/live-women-800 ===')
          status, body, dt = get('https://mangekampanalyse.no/api/live-women-800?t=' + str(time.time()))
          print(f'status={status} took={dt:.2f}s bodylen={len(body)}')
          try:
              data = json.loads(body)
              print('  updatedAt:', data.get('updatedAt'), 'error:', data.get('error'))
          except Exception:
              print('  RAW (first 400 chars):', body[:400])

          print()
          print('=== /api/live-decastar ===')
          status, body, dt = get('https://mangekampanalyse.no/api/live-decastar?t=' + str(time.time()))
          print(f'status={status} took={dt:.2f}s bodylen={len(body)}')
          try:
              data = json.loads(body)
              print('  updatedAt:', data.get('updatedAt'), 'error:', data.get('error'), 'men.completedEvents:', data.get('men',{}).get('completedEvents'))
          except Exception:
              print('  RAW (first 400 chars):', body[:400])
          EOF
          python3 probe_health.py
      - name: Check deployed button code
        run: |
          curl -s "https://mangekampanalyse.no/live-refresh-api-fix20260918.js?v=20260918-livefix2&nocache=$(date +%s)" | grep -o "b.onclick=function(e){e.preventDefault();[^}]*}" || echo "PATTERN NOT FOUND"
