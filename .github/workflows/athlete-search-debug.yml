name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Capture global currentType visibility at the moment of the flip
        run: |
          cat > trace_settype.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            page.on('console', msg => console.log('[page]', msg.text()));
            await page.addInitScript(() => {
              window.__log = [];
              let installed = false;
              const tryInstall = () => {
                if (installed) return;
                if (typeof window.setType !== 'function' || window.setType.__traced) return;
                installed = true;
                const real = window.setType;
                function traced(type) {
                  let fromHere;
                  try { fromHere = (typeof currentType !== 'undefined') ? currentType : 'MISSING-lexical'; }
                  catch (e) { fromHere = 'ERR:' + e.message; }
                  let onWindow;
                  try { onWindow = ('currentType' in window) ? window.currentType : 'MISSING-onwindow'; }
                  catch (e) { onWindow = 'ERR:' + e.message; }
                  window.__log.push({
                    t: Date.now(), event: 'setType-call', argType: type,
                    lexicalCurrentTypeSeenByTracer: fromHere,
                    windowCurrentType: onWindow,
                    stack: new Error().stack.split('\n').slice(0,6).join(' | ')
                  });
                  return real.apply(this, arguments);
                }
                traced.__traced = true;
                window.setType = traced;
              };
              const poll = setInterval(tryInstall, 10);
              setTimeout(() => clearInterval(poll), 6000);
              // Independently poll currentType (lexical + window) every 300ms, but only log on
              // an actual CHANGE (transition), to keep the log short enough to survive truncation
              // even over a 60s window.
              let lastLex = null, lastOnWin = null, lastBtn = null;
              const snap = setInterval(() => {
                let lex, onWin;
                try { lex = (typeof currentType !== 'undefined') ? currentType : 'MISSING'; } catch (e) { lex = 'ERR'; }
                try { onWin = ('currentType' in window) ? window.currentType : 'MISSING'; } catch (e) { onWin = 'ERR'; }
                const btn = document.querySelector('.event-switch-btn.active')?.dataset?.type || null;
                if (lex !== lastLex || onWin !== lastOnWin || btn !== lastBtn) {
                  window.__log.push({ t: Date.now(), event: 'TRANSITION', lex, onWin, btn });
                  lastLex = lex; lastOnWin = onWin; lastBtn = btn;
                }
              }, 300);
              setTimeout(() => clearInterval(snap), 60000);
            });
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);
            await page.click('button.event-switch-btn[data-type="women"]');
            const clickAt = Date.now();
            console.log('CLICKED WOMEN AT', clickAt);
            await page.waitForTimeout(50000);
            const log = await page.evaluate(() => window.__log || []);
            console.log('=== FULL LOG (dt relative to click, ms) — only transitions + setType calls ===');
            console.log(JSON.stringify(log.map(e => ({ dt: e.t - clickAt, ...e, t: undefined })), null, 1));
            await browser.close();
          })();
          EOF
          node trace_settype.js
