name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check the disciplines field from searchCompetitors for Markus Rooth
        run: |
          node <<'NODE'
          const ENDPOINT = 'https://graphql-prod-4894.edge.aws.worldathletics.org/graphql';
          const API_KEY = 'da2-o6pmci4cb5denlbnvn5u3kfexq';
          async function gql(query, variables) {
            const res = await fetch(ENDPOINT, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-api-key': API_KEY, 'x-graphql-client-name': 'worldathletics' },
              body: JSON.stringify({ query, variables }),
            });
            return res.json().catch(() => null);
          }
          const SEARCH = `query SearchCompetitors($query: String) { searchCompetitors(query: $query) { aaAthleteId familyName givenName country gender disciplines } }`;
          (async () => {
            const payload = await gql(SEARCH, { query: 'Markus Rooth' });
            const list = payload?.data?.searchCompetitors || [];
            const rooth = list.find(a => a.aaAthleteId === '14783534');
            console.log('Markus Rooth searchCompetitors entry:', JSON.stringify(rooth, null, 2));

            const payload2 = await gql(SEARCH, { query: 'Jonathan Hertwig' });
            const list2 = payload2?.data?.searchCompetitors || [];
            const jonathan = list2.find(a => a.aaAthleteId === '14989292');
            console.log('\nJonathan Hertwig-Odegaard searchCompetitors entry:', JSON.stringify(jonathan, null, 2));
          })();
          NODE
