name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check what index.html actually serves right now
        run: |
          curl -s "https://mangekampanalyse.no/?nocache=$(date +%s)" -o /tmp/live_index.html -D /tmp/headers.txt
          echo "=== response headers ==="
          cat /tmp/headers.txt
          echo "=== app.js / forecast-enhancements.js references ==="
          grep -o 'app.js?v=[a-z0-9-]*\|forecast-enhancements.js?v=[a-z0-9-]*' /tmp/live_index.html
          echo "=== script tag count ==="
          grep -oc 'app.js\|forecast-enhancements.js' /tmp/live_index.html
