name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm forecastBasisPrediction fix is deployed
        run: |
          curl -s "https://mangekampanalyse.no/live-engine.js" -o /tmp/live-engine.js
          curl -s "https://mangekampanalyse.no/forecast-enhancements.js" -o /tmp/forecast-enhancements.js
          echo "live-engine.js contains forecastBasisPrediction:"
          grep -c "forecastBasisPrediction" /tmp/live-engine.js || true
          echo "forecast-enhancements.js exposes forecastBasisPrediction:"
          grep -c "window.forecastBasisPrediction" /tmp/forecast-enhancements.js || true
