name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump full raw row for men's shot put, watching the active->no-mark transition
        run: |
          cat > probe2.py <<'EOF'
          import json, time
          import urllib.request

          API = 'https://api.athle.matsport.com'
          EVENT_ID = '65e4f577-c90c-4008-9955-dfa3563d7a86_ATSTAM900C00'
          HEADERS = {'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 Mangekampanalyse/2.0'}

          def get(path):
              req = urllib.request.Request(API + path, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))

          watched = {}  # name -> last seen 'current' value, to detect transitions

          for tick in range(15):
              now = time.strftime('%H:%M:%S')
              payload = get(f'/events/{EVENT_ID}')
              rows = (payload.get('horizontalResult') or {}).get('results') or []
              print(f'--- tick {tick} at {now} ---')
              for row in rows:
                  athlete = row.get('athlete') or {}
                  name = (athlete.get('longName') or f"{athlete.get('forename','')} {athlete.get('name','')}").strip()
                  cur = str(row.get('current') or '').strip()
                  prev = watched.get(name)
                  if prev is not None and prev != cur:
                      print(f'  >>> TRANSITION for {name}: current {prev!r} -> {cur!r}')
                      print('      FULL ROW:', json.dumps(row, ensure_ascii=False))
                  watched[name] = cur
                  if cur or (prev is not None and prev != cur):
                      # also always dump full row while active, and right after it stops being active
                      print(f'  {name}: current={cur!r} status={row.get("status")!r} result={row.get("result")!r} points={row.get("points")!r} attemptHorizontal={row.get("attemptHorizontal")!r}')
              time.sleep(6)
          EOF
          python3 probe2.py
