name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Find the "current" field value for the athlete currently in action
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          API = "https://api.athle.matsport.com"

          def get(path):
              req = urllib.request.Request(API + path, headers={
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 Mangekampanalyse/2.0",
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          eid = "65e4f577-c90c-4008-9955-dfa3563d7a86_ATSTAW700B02"
          payload = get(f"/events/{eid}")
          block = payload.get("verticalResult") or {}
          results = block.get("results") or []
          print("event status:", payload.get("status"))
          print(f"{len(results)} athletes\n")
          for row in results:
              name = row.get("athlete", {}).get("longName")
              print(f"{name!r}: current={row.get('current')!r} rank={row.get('rank')} displayRank={row.get('displayRank')} result={row.get('result')} status={row.get('status')!r}")
          EOF
