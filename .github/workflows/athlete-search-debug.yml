name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check men's Stav (pole vault) attempt data right now
        run: |
          curl -s "https://mangekampanalyse.no/api/live-decastar?t=$(date +%s%N)" -o /tmp/live.json
          python3 - <<'PYEOF'
          import json
          d=json.load(open('/tmp/live.json'))
          m=d.get('men',{})
          print("updatedAt:", d.get('updatedAt'))
          print("MEN completedEvents:", m.get('completedEvents'))
          print("eventHasMarks:", m.get('eventHasMarks'))
          results = m.get('results', {})
          print("=== Stav (pole vault) rows ===")
          for name, entry in results.items():
              v = entry.get('Stav')
              if v:
                  print(name, "| mark:", v.get('mark'), "| status:", v.get('resultStatus'), "| active:", v.get('active'), "| attempts:", v.get('attempts'))
          print("=== Diskos rows (for comparison) ===")
          for name, entry in results.items():
              v = entry.get('Diskos')
              if v:
                  print(name, "| mark:", v.get('mark'), "| status:", v.get('resultStatus'), "| active:", v.get('active'), "| attempts len:", len(v.get('attempts') or []))
          PYEOF
