name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Verify the show-points toggle in the live browser
        run: |
          cat > probe8.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('[console] ' + msg.text()); });
            await page.goto('https://mangekampanalyse.no/?nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.click('[data-tab="forecast"]');
            await page.waitForTimeout(800);
            const btn = page.locator('#forecastPointsToggle');
            const before = await page.evaluate(() => document.querySelector('#liveForecastBody tr td:nth-child(4)')?.textContent);
            console.log('BEFORE TOGGLE (mark mode) first event cell text:', JSON.stringify(before));
            await btn.click();
            await page.waitForTimeout(300);
            const after = await page.evaluate(() => document.querySelector('#liveForecastBody tr td:nth-child(4)')?.textContent);
            const title = await page.evaluate(() => document.querySelector('#liveForecastBody tr td:nth-child(4)')?.getAttribute('title'));
            const btnText = await page.evaluate(() => document.querySelector('#forecastPointsToggle')?.textContent);
            const ariaPressed = await page.evaluate(() => document.querySelector('#forecastPointsToggle')?.getAttribute('aria-pressed'));
            console.log('AFTER TOGGLE (points mode) first event cell text:', JSON.stringify(after));
            console.log('cell title/hover value:', JSON.stringify(title));
            console.log('button text now:', JSON.stringify(btnText), 'aria-pressed:', ariaPressed);
            await btn.click();
            await page.waitForTimeout(300);
            const backToMarks = await page.evaluate(() => document.querySelector('#liveForecastBody tr td:nth-child(4)')?.textContent);
            console.log('AFTER TOGGLE BACK (mark mode again):', JSON.stringify(backToMarks));
            console.log('JS ERRORS:', JSON.stringify(errors));
            await browser.close();
          })();
          EOF
          node probe8.js
