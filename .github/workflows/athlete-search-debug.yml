name: Athlete search debug (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check the WA news report page for a results link
        run: |
          for url in \
            "https://worldathletics.org/news/report/decastar-talence-2026" \
            "https://worldathletics.org/competitions/world-athletics-combined-events-tour/news/decastar-talence-2026"; do
            echo "== $url =="
            curl -s -m 20 -A "Mozilla/5.0 Mangekampanalyse/2.0" "$url" -o /tmp/news.html
            wc -c /tmp/news.html
            grep -o 'calendar-results/results/[0-9]*[^"'"'"']*' /tmp/news.html | sort -u
            grep -o '"competitionId"[^,}]*' /tmp/news.html | sort -u | head -10
            grep -o '"eventId_WA"[^,}]*' /tmp/news.html | sort -u | head -10
            grep -o '"nameUrlSlug":"decastar[^"]*"' /tmp/news.html | sort -u | head -10
          done
