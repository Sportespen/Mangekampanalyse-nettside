name: Update Birmingham live data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-birmingham-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Update Birmingham live data
        run: python tools/update_birmingham_live.py
      - name: Commit changed live data
        shell: bash
        run: |
          if git diff --quiet -- app/data/live_birmingham.js; then
            echo 'No live-data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/data/live_birmingham.js
          git commit -m 'Update Birmingham live results'
          git push
