# Validate critical app behaviour before deploying static content to GitHub Pages
name: Test and deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    name: Production smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Mangekampanalyse smoke tests
        run: python scripts/smoke_test.py
      - name: JavaScript syntax check
        run: |
          node --check app/app.js
          node --check app/live-engine.js
          node --check app/live-attempt-details.js
          node --check app/athlete-compare-basis-modal.js
          node --check app/i18n.js
          node --check app/i18n-final-data.js
          node --check app/i18n-final-runtime.js

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
