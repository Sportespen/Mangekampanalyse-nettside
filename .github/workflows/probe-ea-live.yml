name: Probe European Athletics live feed

on:
  push:
    paths:
      - '.github/workflows/probe-ea-live.yml'
      - 'tools/probe_ea_live.py'
      - 'tools/probe_ea_attempts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install requests beautifulsoup4
      - name: Probe Birmingham field attempts
        run: python tools/probe_ea_attempts.py
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: ea-attempt-probe
          path: ea-attempt-probe.json
