name: WA toplist access diagnostic
on:
  push:
    paths:
      - '.github/workflows/wa-schema-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test direct World Athletics toplist access
        shell: bash
        run: |
          set -u
          URL='https://worldathletics.org/records/toplists/combined-events/decathlon/all/men/senior/2026?ageCategory=senior&bestResultsOnly=true&maxResultsByCountry=all&page=1&regionType=world&windReading=regular'
          CODE=$(curl -L -A 'Mozilla/5.0' -sS -o /tmp/wa.html -w '%{http_code}' "$URL")
          echo "HTTP=$CODE"
          echo "BYTES=$(wc -c </tmp/wa.html)"
          grep -Eoi 'Jonathan[^<]{0,80}|Markus[^<]{0,80}|Leo[^<]{0,80}' /tmp/wa.html | head -20 || true
          head -c 300 /tmp/wa.html | tr '\n' ' ' || true
