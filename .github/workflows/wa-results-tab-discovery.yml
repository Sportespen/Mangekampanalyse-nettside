name: WA results-tab discovery (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe worldathletics.org for a season-specific full-results endpoint
        run: |
          node <<'NODE'
          const ID = 14834505; // Sander Skotheim - has a known, rich 2024 season per the WA site's own "Results" tab
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};

          async function fetchText(url){
            const r = await fetch(url, {headers: UA});
            const text = await r.text();
            return {status:r.status, text};
          }

          function extractNextData(html){
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            if(idx===-1) return null;
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            try{ return JSON.parse(html.slice(openEnd,closeIdx)); }catch(e){ return null; }
          }

          function summarizeCompetitor(nextData){
            const c = nextData?.props?.pageProps?.competitor;
            if(!c) return 'no competitor in pageProps';
            const keys = Object.keys(c);
            const ry = c.resultsByYear;
            return {
              competitorKeys: keys,
              resultsByYearKeys: ry ? Object.keys(ry) : null,
              resultsByYearYear: ry?.year ?? ry?.activeYear ?? null,
              resultsByYearAvailableYears: ry?.years ?? ry?.availableYears ?? null,
              resultsByEventCount: Array.isArray(ry?.resultsByEvent) ? ry.resultsByEvent.length : null,
            };
          }

          function findApiHints(html){
            const hints = new Set();
            const patterns = [/https?:\/\/[a-z0-9.-]*worldathletics[a-z0-9.-]*\/[a-zA-Z0-9_\-./]*graphql[a-zA-Z0-9_\-./]*/gi, /"\/api\/[a-zA-Z0-9_\-./]+"/gi, /\/_next\/data\/[a-zA-Z0-9_\-./]+\.json/gi];
            for(const re of patterns){
              const matches = html.match(re) || [];
              for(const m of matches) hints.add(m);
              if(hints.size > 20) break;
            }
            return [...hints].slice(0,20);
          }

          const candidates = [
            `https://worldathletics.org/athletes/-/${ID}`,
            `https://worldathletics.org/athletes/-/${ID}?year=2024`,
            `https://worldathletics.org/athletes/-/${ID}?season=2024`,
            `https://worldathletics.org/athletes/-/${ID}/results`,
            `https://worldathletics.org/athletes/-/${ID}/results?year=2024`,
            `https://worldathletics.org/athletes/-/${ID}/results/2024`,
            `https://worldathletics.org/athletes/norway/sander-skotheim-${ID}/results`,
          ];

          (async () => {
            for (const url of candidates) {
              console.log('\n=== ' + url + ' ===');
              try {
                const { status, text } = await fetchText(url);
                console.log('HTTP status:', status, '| HTML length:', text.length);
                const nextData = extractNextData(text);
                if (nextData) {
                  console.log('competitor summary:', JSON.stringify(summarizeCompetitor(nextData), null, 2));
                } else {
                  console.log('no __NEXT_DATA__ found (or not JSON)');
                }
                const hints = findApiHints(text);
                if (hints.length) console.log('possible API/data-endpoint hints:', JSON.stringify(hints, null, 2));
              } catch (e) {
                console.log('ERROR:', e.message || String(e));
              }
              await new Promise(r => setTimeout(r, 400));
            }
          })();
          NODE
