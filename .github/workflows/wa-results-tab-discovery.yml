name: WA results-tab discovery (diagnostic)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe worldathletics.org for a season-specific full-results endpoint
        run: |
          node <<'NODE'
          const ID = 14834505; // Sander Skotheim - has a known, rich 2024 season per the WA site's own "Results" tab
          const UA = {'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'};

          async function fetchText(url, opts){
            const r = await fetch(url, {headers: UA, ...opts});
            const text = await r.text();
            return {status:r.status, text};
          }

          function extractNextData(html){
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            if(idx===-1) return null;
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            try{ return JSON.parse(html.slice(openEnd,closeIdx)); }catch(e){ return null; }
          }

          function findNear(html, needle, radius){
            const out = [];
            let from = 0;
            for (let i = 0; i < 10; i++) {
              const idx = html.indexOf(needle, from);
              if (idx === -1) break;
              out.push(html.slice(Math.max(0, idx - radius), idx + needle.length + radius));
              from = idx + needle.length;
            }
            return out;
          }

          (async () => {
            const { status, text } = await fetchText(`https://worldathletics.org/athletes/-/${ID}`);
            console.log('base page HTTP status:', status, '| HTML length:', text.length);
            const nextData = extractNextData(text);
            const c = nextData?.props?.pageProps?.competitor;
            console.log('\n=== resultsByYear.parameters (full) ===');
            console.log(JSON.stringify(c?.resultsByYear?.parameters, null, 2));
            console.log('\n=== resultsByYear.activeYears (full) ===');
            console.log(JSON.stringify(c?.resultsByYear?.activeYears, null, 2));
            console.log('\n=== resultsByYear.resultsByEvent[0] (shape sample) ===');
            console.log(JSON.stringify(c?.resultsByYear?.resultsByEvent?.[0], null, 2));
            console.log('\n=== nextData.buildId ===');
            console.log(nextData?.buildId);
            console.log('\n=== nextData.page / nextData.query (route info) ===');
            console.log(JSON.stringify({page: nextData?.page, query: nextData?.query}, null, 2));

            console.log('\n=== occurrences of "activeYears" in raw HTML (context) ===');
            for (const ctx of findNear(text, 'activeYears', 80)) console.log('---\n' + ctx);

            console.log('\n=== occurrences of "graphql" (case-insensitive) in raw HTML (context) ===');
            const lower = text.toLowerCase();
            const seen = new Set();
            let from = 0;
            for (let i = 0; i < 8; i++) {
              const idx = lower.indexOf('graphql', from);
              if (idx === -1) break;
              const ctx = text.slice(Math.max(0, idx - 60), idx + 60);
              if (!seen.has(ctx)) { seen.add(ctx); console.log('---\n' + ctx); }
              from = idx + 7;
            }

            // If buildId exists, try the Next.js data route directly for a past year query.
            if (nextData?.buildId) {
              for (const y of [2024, 2023]) {
                const dataUrl = `https://worldathletics.org/_next/data/${nextData.buildId}/athletes/-/${ID}.json?year=${y}&id=${ID}`;
                console.log('\n=== ' + dataUrl + ' ===');
                try {
                  const r2 = await fetchText(dataUrl);
                  console.log('HTTP status:', r2.status, '| length:', r2.text.length);
                  console.log('body (first 800 chars):', r2.text.slice(0, 800));
                } catch (e) {
                  console.log('ERROR:', e.message || String(e));
                }
              }
            }
          })();
          NODE
