name: Production uptime monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public site
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 3 \
            https://mangekampanalyse.no/ >/dev/null

      - name: Check app
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 3 \
            https://mangekampanalyse.no/ -o "$BODY"
          grep -q 'Mangekampanalyse Pro' "$BODY"
          grep -q 'liveForecastBody' "$BODY"
