name: Décastar history bulk (recent results)

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decastar-history-bulk.yml'
  workflow_dispatch:
  # Runs daily so the forecast basis keeps picking up new results (e.g. a championship
  # decathlon happening mid-week) automatically right up until Décastar Talence 2026 starts,
  # without needing a manual dispatch each time. Still lands as a PR that needs merging (GitHub
  # Actions can't create/approve PRs in this repo), not a direct push to main.
  schedule:
    - cron: '0 5 * * *'

jobs:
  # World Athletics seems to cap successful HTML fetches at ~20-21 per single job execution,
  # regardless of pause length between requests (confirmed today via decastar-pb-bulk.yml).
  # A fresh job/runner resets that budget, so this plans a matrix of small batches - one job
  # per batch, run sequentially - across all Décastar athletes.
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compute fetch batches
        id: plan
        run: |
          node <<'NODE' > /tmp/chunks.json
          global.window={};
          for(const p of ['./app/data/00_base.js','./app/data/decastar_men.js','./app/data/decastar_women.js']) require(p);
          const roster={men:window.MANGEKAMP_DATA.men.decastar,women:window.MANGEKAMP_DATA.women.decastar};
          const BATCH_SIZE=16;
          const chunks=[];
          for(const type of ['men','women']){
            const names=roster[type].map(a=>a.name);
            for(let i=0;i<names.length;i+=BATCH_SIZE) chunks.push({type,names:names.slice(i,i+BATCH_SIZE)});
          }
          process.stdout.write(JSON.stringify(chunks));
          NODE
          echo "chunks=$(cat /tmp/chunks.json)" >> "$GITHUB_OUTPUT"
          echo "Planned batches:"; cat /tmp/chunks.json

  history:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check out this run's shared history branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="decastar-history-${{ github.run_id }}"
          if git fetch origin "$BRANCH" 2>/dev/null && git checkout "$BRANCH"; then
            echo "Reusing existing branch $BRANCH (earlier batch in this run already created it)"
          else
            git checkout -b "$BRANCH"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          npm install playwright@1 --no-save >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture WA GraphQL key
        # worldathletics.org has no public API. Its own frontend calls an internal GraphQL
        # backend using a short-lived "x-api-key" header that only ever appears in real browser
        # network traffic - watching a real page load reveals it. Same technique already proven
        # live by rankingstevner.no's scripts/wa-key-refresh.mjs (confirmed working for this
        # exact operation via .github/workflows/wa-graphql-key-test.yml's diagnostic run here).
        # Captured fresh per batch (rather than shared across the whole matrix run) since the key
        # rotates and later batches run much later, on separate runners, sequentially.
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const CAPTURE_TIMEOUT_MS = 30000;
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              let found = null;
              page.on('request', (req) => {
                if (found) return;
                const apiKey = req.headers()['x-api-key'];
                if (!apiKey) return;
                if (!/\.edge\.aws\.worldathletics\.org$/.test(new URL(req.url()).hostname)) return;
                found = { apiKey, endpoint: req.url() };
              });
              await page.goto('https://worldathletics.org/athletes/-/14834505', { waitUntil: 'load', timeout: CAPTURE_TIMEOUT_MS }).catch(() => {});
              const deadline = Date.now() + CAPTURE_TIMEOUT_MS;
              while (!found && Date.now() < deadline) await page.waitForTimeout(500);
              if (!found) { console.error('Could not capture a WA GraphQL key within the timeout.'); process.exit(1); }
              fs.writeFileSync('/tmp/wa-key.json', JSON.stringify(found));
              console.log('Captured WA GraphQL endpoint:', found.endpoint);
            } finally {
              await browser.close();
            }
          })();
          NODE
      - name: Fetch this batch's recent results (nearest season first)
        env:
          CHUNK_TYPE: ${{ matrix.chunk.type }}
          CHUNK_NAMES: ${{ toJson(matrix.chunk.names) }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          for(const p of ['./app/data/00_base.js','./app/data/decastar_men.js','./app/data/decastar_women.js']) require(p);

          const roster={men:window.MANGEKAMP_DATA.men.decastar,women:window.MANGEKAMP_DATA.women.decastar};

          const eventMap={
            men:{'100m':'100 Metres','Lengde':'Long Jump','Kule':'Shot Put','Høyde':'High Jump','400m':'400 Metres','110mh':'110 Metres Hurdles','Diskos':'Discus Throw','Stav':'Pole Vault','Spyd':'Javelin Throw','1500m':'1500 Metres'},
            women:{'100mh':'100 Metres Hurdles','Høyde':'High Jump','Kule':'Shot Put','200m':'200 Metres','Lengde':'Long Jump','Spyd':'Javelin Throw','800m':'800 Metres'}
          };

          const MONTHS={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
          function parseWaDate(s){
            const m=String(s||'').trim().match(/^(\d{1,2})\s+([A-Z]{3})\s+(\d{4})$/);
            if(!m) return null;
            const [,d,mon,y]=m;
            const month=MONTHS[mon];
            if(!month) return null;
            return {iso:`${y}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}T00:00:00.000Z`,year:y};
          }
          function toNumericMark(mark){
            const s=String(mark||'').trim();
            const t=s.match(/^(\d+):(\d+(?:\.\d+)?)$/);
            if(t) return Number(t[1])*60+Number(t[2]);
            const n=Number(s.replace(',','.'));
            return Number.isFinite(n)?n:null;
          }
          function meetName(competition){
            const first=String(competition||'').split(',')[0].trim();
            return first||String(competition||'');
          }
          function venueFromCompetition(competition){
            const parts=String(competition||'').split(',').map(s=>s.trim());
            return parts[1]||parts[0]||'';
          }

          const waKey=JSON.parse(fs.readFileSync('/tmp/wa-key.json','utf8'));
          // Confirmed live (see .github/workflows/wa-graphql-key-test.yml's diagnostic run) that,
          // unlike the athlete profile page's own embedded resultsByYear (always current season,
          // no URL override - confirmed via an earlier throwaway diagnostic run), this GraphQL
          // operation is the exact one the real worldathletics.org frontend calls for its own
          // "Results" tab season dropdown: it takes an explicit year and returns that whole
          // season's full per-competition results, same technique rankingstevner.no's
          // functions/api/wa-results.js already relies on.
          const RESULTS_QUERY=`query GetSingleCompetitorResultsDiscipline($id: Int, $resultsByYearOrderBy: String, $resultsByYear: Int) {
            getSingleCompetitorResultsDiscipline(id: $id, resultsByYear: $resultsByYear, resultsByYearOrderBy: $resultsByYearOrderBy) {
              resultsByEvent { discipline results { date competition venue place mark wind notLegal resultScore category competitionId eventId } }
            }
          }`;
          async function fetchYearResults(id,year){
            const r=await fetch(waKey.endpoint,{
              method:'POST',
              headers:{'content-type':'application/json','x-graphql-client-name':'worldathletics','x-api-key':waKey.apiKey},
              body:JSON.stringify({query:RESULTS_QUERY,variables:{id:Number(id),resultsByYear:year,resultsByYearOrderBy:'discipline'}})
            });
            const text=await r.text();
            let payload=null;
            try{ payload=JSON.parse(text); }catch(_e){}
            if(!r.ok) throw new Error(`WA GraphQL ${r.status}: ${text.slice(0,200)}`);
            if(Array.isArray(payload?.errors)&&payload.errors.length) throw new Error(payload.errors[0]?.message||'WA GraphQL error');
            return payload?.data?.getSingleCompetitorResultsDiscipline?.resultsByEvent||[];
          }

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const MAX_BASIS=4;
          // Each extra season back is one more GraphQL request covering ALL disciplines at once
          // (not one request per discipline), so this bounds the per-athlete request count. The
          // loop below already stops earlier than this the moment every discipline has enough.
          const MAX_YEARS_BACK=4;

          (async()=>{
            const chunkType=process.env.CHUNK_TYPE;
            const chunkNames=new Set(JSON.parse(process.env.CHUNK_NAMES||'[]'));
            const currentYear=new Date().getUTCFullYear();

            // decastar_history.js is fully regenerated each batch. Start from everything
            // already on this run's shared branch (either the originally-committed file, or an
            // earlier batch's contribution this run) so nobody else's data is lost - this batch
            // only ever touches its own chunk's names below.
            let H={};
            try{
              const prevJs=fs.readFileSync('app/data/decastar_history.js','utf8');
              const m=prevJs.match(/const H=(\{[\s\S]*?\});\n\s*for/);
              if(m) H=JSON.parse(m[1]);
            }catch(_e){ /* no previous file yet */ }

            let prevReport={athletes:{},missing:[]};
            try{ prevReport=JSON.parse(fs.readFileSync('app/data/decastar_history_report.json','utf8')); }catch(_e){}
            const report={
              generatedAt:new Date().toISOString(),
              athletes:{...(prevReport.athletes||{})},
              missing:(prevReport.missing||[]).filter(m=>!chunkNames.has(m.athlete))
            };

            for(const athlete of roster[chunkType]){
              if(!chunkNames.has(athlete.name)) continue;
              const type=chunkType;
              const name=athlete.name;
              const id=athlete.waId;
              if(!id){ report.missing.push({athlete:name,error:'no waId in roster file'}); continue; }
              try{
                const disciplines=Object.entries(eventMap[type]);
                const rowsByOurEvent=new Map(disciplines.map(([ourEvent])=>[ourEvent,[]]));
                const seenKey=new Set();
                let yearsFetched=0;
                let lastError=null;
                for(let year=currentYear; year>currentYear-MAX_YEARS_BACK; year--){
                  const stillShort=disciplines.some(([ourEvent])=>rowsByOurEvent.get(ourEvent).length<MAX_BASIS);
                  if(!stillShort) break;
                  let events;
                  try{ events=await fetchYearResults(id,year); }
                  catch(e){ lastError=e; yearsFetched++; await sleep(350); continue; }
                  yearsFetched++;
                  for(const [ourEvent,discipline] of disciplines){
                    const bucket=rowsByOurEvent.get(ourEvent);
                    if(bucket.length>=MAX_BASIS) continue;
                    const ev=events.find(e=>e.discipline===discipline);
                    if(!ev||!Array.isArray(ev.results)) continue;
                    for(const row of ev.results){
                      if(bucket.length>=MAX_BASIS) break;
                      const parsed=parseWaDate(row.date);
                      const numeric=toNumericMark(row.mark);
                      if(!parsed||numeric==null) continue;
                      const key=`${row.competitionId||''}|${parsed.iso}|${row.mark}`;
                      if(seenKey.has(key)) continue;
                      seenKey.add(key);
                      bucket.push({numeric,display:String(row.mark),venue:row.venue||venueFromCompetition(row.competition),year:parsed.year,iso:parsed.iso,meet:meetName(row.competition)});
                    }
                  }
                  await sleep(350);
                }
                const byEvent={};
                for(const [ourEvent] of disciplines){
                  const bucket=rowsByOurEvent.get(ourEvent);
                  if(!bucket.length) continue;
                  bucket.sort((a,b)=>b.iso.localeCompare(a.iso));
                  byEvent[ourEvent]=bucket.slice(0,MAX_BASIS).map(r=>[r.numeric,r.display,r.venue,r.year,r.iso,r.meet]);
                }
                // Only overwrite this athlete's entry when the fresh fetch actually yielded
                // usable data - a transient fetch failure or an empty response should never
                // wipe out perfectly good data already on the branch.
                if(Object.keys(byEvent).length){ H[name]=byEvent; report.athletes[name]={events:Object.keys(byEvent),yearsFetched}; }
                else report.athletes[name]={events:[],yearsFetched,error:lastError?String(lastError.message||lastError):undefined,note:'no events with usable results this run - kept previous data if any'};
              }catch(e){
                report.athletes[name]={error:String(e.message||e),note:'kept previous data if any'};
                report.missing.push({athlete:name,error:String(e.message||e)});
              }
            }

            const js=`// AUTO-GENERATED by .github/workflows/decastar-history-bulk.yml\n// Recent per-event results for every Décastar roster athlete, fetched fresh from World\n// Athletics' internal GraphQL backend each run (nearest season first, only reaching further\n// back than the current+previous season when a discipline still has fewer than 4 valid\n// results) and always overwritten - no longer skips athletes who already had Birmingham-\n// sourced history, since that data can go stale mid-championship and never got refreshed.\nwindow.MANGEKAMP_HISTORY=window.MANGEKAMP_HISTORY||{};\n(function(){\n const H=${JSON.stringify(H)};\n for(const [name,byEvent] of Object.entries(H)){ window.MANGEKAMP_HISTORY[name]=byEvent; }\n})();\n`;
            fs.writeFileSync('app/data/decastar_history.js',js);
            fs.writeFileSync('app/data/decastar_history_report.json',JSON.stringify(report,null,2));
            console.log('BATCH DONE type='+chunkType+' size='+chunkNames.size+' totalFetched='+Object.keys(H).length+' totalMissing='+report.missing.length);
            if(report.missing.length) console.log('MISSING '+JSON.stringify(report.missing));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit this batch's history data
        run: |
          # decastar_history.js's <script> tag has no cache-busting query string of its own
          # otherwise, so a browser/CDN can keep serving a stale copy after this file changes.
          sed -i -E "s#(data/decastar_history\.js\?v=)[^\"]*#\1$(date +%Y%m%d%H%M%S)#" app/index.html
          git add app/data/decastar_history.js app/data/decastar_history_report.json app/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fetch recent Décastar ${{ matrix.chunk.type }} results (batch ${{ strategy.job-index }} of ${{ strategy.job-total }})"
          git push -u origin "$BRANCH"

  open-pr:
    needs: history
    if: always() && needs.history.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open pull request for the accumulated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="decastar-history-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title 'Fetch recent Décastar results for forecast basis' \
              --body 'Auto-generated by decastar-history-bulk.yml, fetched in batches (see the "plan" and "history" job logs for the batch breakdown). Review app/data/decastar_history_report.json for any missing/errored athletes before merging.'
          else
            echo "No branch was pushed - nothing changed, nothing to open a PR for."
          fi
