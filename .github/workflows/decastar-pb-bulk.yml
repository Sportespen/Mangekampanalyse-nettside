name: Décastar PB bulk audit

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decastar-pb-bulk.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and verify Décastar Talence 2026 senior PBs
        run: |
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          for(const p of ['./app/data/00_base.js','./app/data/decastar_men.js','./app/data/decastar_women.js']) require(p);

          const roster={men:window.MANGEKAMP_DATA.men.decastar,women:window.MANGEKAMP_DATA.women.decastar};
          const base='https://worldathletics.nimarion.de';

          const eventMap={
            men:{'100m':'100 Metres','Lengde':'Long Jump','Kule':'Shot Put','Høyde':'High Jump','400m':'400 Metres','110mh':'110 Metres Hurdles','Diskos':'Discus Throw','Stav':'Pole Vault','Spyd':'Javelin Throw','1500m':'1500 Metres'},
            women:{'100mh':'100 Metres Hurdles','Høyde':'High Jump','Kule':'Shot Put','200m':'200 Metres','Lengde':'Long Jump','Spyd':'Javelin Throw','800m':'800 Metres'}
          };
          const windEvents=new Set(['100m','Lengde','110mh','100mh','200m']);
          const scoreMap={
            men:{'100m':[25.4347,18,1.81,'time'],'Lengde':[0.14354,220,1.4,'cm'],'Kule':[51.39,1.5,1.05,'field'],'Høyde':[0.8465,75,1.42,'cm'],'400m':[1.53775,82,1.81,'time'],'110mh':[5.74352,28.5,1.92,'time'],'Diskos':[12.91,4,1.1,'field'],'Stav':[0.2797,100,1.35,'cm'],'Spyd':[10.14,7,1.08,'field'],'1500m':[0.03768,480,1.85,'time']},
            women:{'100mh':[9.23076,26.7,1.835,'time'],'Høyde':[1.84523,75,1.348,'cm'],'Kule':[56.0211,1.5,1.05,'field'],'200m':[4.99087,42.5,1.81,'time'],'Lengde':[0.188807,210,1.41,'cm'],'Spyd':[15.9803,3.8,1.04,'field'],'800m':[0.11193,254,1.88,'time']}
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function getJson(url,attempt=1){
            const r=await fetch(url,{headers:{accept:'application/json','user-agent':'Mangekampanalyse-Pro/1.0'}});
            const t=await r.text();
            if(!r.ok){
              if(r.status>=500&&attempt<4){ await sleep(500*attempt); return getJson(url,attempt+1); }
              throw new Error(`${r.status} ${url} ${t.slice(0,200)}`);
            }
            return JSON.parse(t);
          }

          // Same approach as Sportespen/Rankingstevner (functions/_shared/wa-graphql.js,
          // functions/api/athlete-search.js): worldathletics.nimarion.de's own REST wrapper
          // (/athletes/search, /athletes/{id}) is a single-maintainer proxy with no SLA that goes
          // down for extended periods - confirmed here (every call 500s, even retried). Its two
          // tiny GraphQL-discovery routes are a separate, much simpler piece of that same service
          // though, and Rankingstevner's codebase treats them as reliable: use them only to learn
          // World Athletics' own GraphQL endpoint+key, then query that real backend directly for
          // both the athlete search and the results themselves. nimarion's REST wrapper is kept
          // only as a last-resort fallback if the direct path fails outright for an athlete.
          async function discoverWaGraphql(){
            const [endpointRes,keyRes]=await Promise.all([
              fetch('https://worldathletics.nimarion.de/graphql/endpoint',{headers:{accept:'application/json'}}),
              fetch('https://worldathletics.nimarion.de/graphql/api-key',{headers:{accept:'application/json'}})
            ]);
            if(!endpointRes.ok||!keyRes.ok) throw new Error('WA GraphQL discovery failed');
            const endpointData=await endpointRes.json();
            const keyData=await keyRes.json();
            const endpoint=endpointData?.endpoint||endpointData?.url||endpointData?.value||endpointData?.apiEndpoint;
            const apiKey=keyData?.apiKey||keyData?.key||keyData?.value||keyData?.token;
            if(!endpoint||!apiKey) throw new Error('Incomplete WA GraphQL discovery');
            return {endpoint,apiKey};
          }
          async function waGraphQL(gql,query,variables){
            const r=await fetch(gql.endpoint,{method:'POST',headers:{'content-type':'application/json','x-api-key':gql.apiKey},body:JSON.stringify({query,variables})});
            const t=await r.text();
            let payload=null; try{payload=JSON.parse(t);}catch(_){}
            if(!r.ok) throw new Error(`WA GraphQL ${r.status}: ${t.slice(0,200)}`);
            if(Array.isArray(payload?.errors)&&payload.errors.length) throw new Error(payload.errors[0]?.message||'WA GraphQL error');
            return payload?.data;
          }
          // Same technique as functions/_shared/wa-html.js in Rankingstevner: the public,
          // server-rendered athlete profile page embeds its data as plain JSON in a
          // <script id="__NEXT_DATA__"> tag - no API key, no nimarion dependency at all.
          async function fetchCompetitorFromHtml(id){
            const r=await fetch(`https://worldathletics.org/athletes/-/${id}`,{headers:{'User-Agent':'Mozilla/5.0 Mangekampanalyse-Pro/1.0'}});
            if(!r.ok) throw new Error(`worldathletics.org ${r.status}`);
            const html=await r.text();
            const marker='id="__NEXT_DATA__"';
            const idx=html.indexOf(marker);
            if(idx===-1) throw new Error('__NEXT_DATA__ not found');
            const openEnd=html.indexOf('>',idx)+1;
            const closeIdx=html.indexOf('</script>',openEnd);
            const nextData=JSON.parse(html.slice(openEnd,closeIdx));
            const competitor=nextData?.props?.pageProps?.competitor;
            if(!competitor) throw new Error('no competitor in page');
            return competitor;
          }
          // Defensive: this page's exact personal-bests field name isn't confirmed anywhere in
          // Rankingstevner's codebase (it only ever reads basicData/worldRankings from this same
          // page), so try every plausible shape rather than assuming one.
          function extractPbRowsFromCompetitor(c){
            const candidates=[c?.personalBests,c?.personalbests,c?.seasonsBests?.personalBests,c?.honours?.personalBests];
            for(const cand of candidates){
              const list=Array.isArray(cand)?cand:(Array.isArray(cand?.results)?cand.results:null);
              if(list&&list.length) return list.map(r=>({discipline:r.discipline||r.disciplineName||r.event,mark:r.mark||r.result,date:r.date,legal:r.legal,wind:r.wind??r.windReading}));
            }
            return null;
          }
          const RESULTS_QUERY=`query GetSingleCompetitorResultsDiscipline($id: Int, $resultsByYearOrderBy: String, $resultsByYear: Int) {
            getSingleCompetitorResultsDiscipline(id: $id, resultsByYear: $resultsByYear, resultsByYearOrderBy: $resultsByYearOrderBy) {
              resultsByEvent { discipline results { date competition place mark wind notLegal resultScore category } }
            }
          }`;
          async function resultsForYearDirect(gql,id,year){
            const data=await waGraphQL(gql,RESULTS_QUERY,{id:Number(id),resultsByYear:year,resultsByYearOrderBy:'discipline'});
            const events=data?.getSingleCompetitorResultsDiscipline?.resultsByEvent;
            if(!Array.isArray(events)) throw new Error('No results in response');
            const flat=[];
            for(const ev of events) for(const r of (ev?.results||[])) flat.push({discipline:ev?.discipline,mark:r.mark,date:r.date,legal:r.notLegal!==true,wind:r.wind,category:r.category});
            return flat;
          }
          function value(event,mark){
            const m=String(mark).match(/^(\d+):(\d+(?:\.\d+)?)$/);
            if(m) return Number(m[1])*60+Number(m[2]);
            return Number(String(mark).replace(',','.'));
          }
          function score(type,event,v){
            let [A,B,C,kind]=scoreMap[type][event];
            if(kind==='time') return Math.floor(A*Math.pow(B-v,C));
            if(kind==='cm') v*=100;
            return Math.floor(A*Math.pow(v-B,C));
          }
          function venue(row){
            const l=row?.location||{};
            const first=[l.stadium,l.city].filter(Boolean).join(', ');
            const country=l.country?` (${l.country})`:'';
            const indoor=l.indoor?' (i)':'';
            return `${first}${country}${indoor}`.trim();
          }
          function isoDate(row){return row?.date?String(row.date).slice(0,10):''}
          function isIndoor(row){return !!row?.location?.indoor || /\(i\)|indoor/i.test(venue(row));}
          function windApproved(event,row){
            if(!windEvents.has(event)||isIndoor(row))return true;
            if(row?.legal===true)return true;
            const raw=String(row?.wind??row?.windReading??'').trim().replace(',','.');
            if(!raw)return false;
            const w=Number(raw.replace(/[^0-9.+-]/g,''));
            return Number.isFinite(w)&&w<=2.0;
          }
          function birthYear(profile){
            const raw=profile?.birthDate||profile?.dateOfBirth||profile?.yearOfBirth||'';
            const m=String(raw).match(/(?:19|20)\d{2}/);
            return m?m[0]:'';
          }

          (async()=>{
            const audit={generatedAt:new Date().toISOString(),source:'1) worldathletics.org profile HTML (direct, no key) 2) WA GraphQL direct (nimarion for key discovery only) 3) nimarion REST as last resort',athletes:{},missing:[]};
            const verified={men:{},women:{}};

            let gql=null,gqlError=null;
            try{ gql=await discoverWaGraphql(); }
            catch(e){ gqlError=String(e.message||e); }
            audit.graphqlDiscovery=gql?'ok':`failed: ${gqlError}`;

            const thisYear=new Date().getUTCFullYear();
            const years=[thisYear,thisYear-1,thisYear-2];

            for(const type of ['men','women']){
              for(const athlete of roster[type]){
                const name=athlete.name;
                const id=athlete.waId;
                audit.athletes[name]={type,waId:id,events:{}};
                let birth='',pbRows=null,source=null,competitorObj=null;

                if(!id){ audit.missing.push({athlete:name,type,error:'no waId in roster file'}); continue; }

                // 1) Public profile page HTML - no key, no nimarion, most robust per Rankingstevner.
                try{
                  const competitor=await fetchCompetitorFromHtml(id);
                  competitorObj=competitor;
                  birth=birthYear(competitor?.basicData||{});
                  const rows=extractPbRowsFromCompetitor(competitor);
                  if(rows&&rows.length){ pbRows=rows; source='wa-html-direct'; }
                  else audit.athletes[name].htmlFieldsSeen=Object.keys(competitor||{});
                }catch(e){ audit.athletes[name].htmlError=String(e.message||e); }

                // WR column (app.js's own header tooltip: "utøverens plassering på World
                // Athletics verdensranking") - the athlete's current combined-events world
                // ranking place, from the same competitor object already fetched above.
                const wrEventGroup=type==='men'?"Men's Decathlon":"Women's Heptathlon";
                const wrEntry=(competitorObj?.worldRankings?.current||[]).find(x=>x.eventGroup===wrEventGroup);
                const wr=wrEntry&&Number.isFinite(Number(wrEntry.place))?Number(wrEntry.place):null;

                // 2) World Athletics GraphQL direct (needs the nimarion-discovered key).
                if((!pbRows||!pbRows.length)&&gql){
                  try{
                    const perYear=await Promise.all(years.map(y=>resultsForYearDirect(gql,id,y).catch(()=>[])));
                    const flat=perYear.flat();
                    if(flat.length){ pbRows=flat; source='wa-graphql-direct'; }
                  }catch(e){ audit.athletes[name].resultsDirectError=String(e.message||e); }
                }

                // 3) nimarion's own REST wrapper - last resort only.
                if(!pbRows||!pbRows.length){
                  try{
                    const profile=await getJson(`${base}/athletes/${id}`);
                    pbRows=(Array.isArray(profile.personalbests)?profile.personalbests:[]).map(r=>({discipline:r.discipline,mark:r.mark,date:r.date,legal:r.legal,wind:r.wind??r.windReading}));
                    if(!birth) birth=birthYear(profile);
                    if(pbRows.length) source='nimarion-rest';
                  }catch(e){ audit.athletes[name].resultsNimarionError=String(e.message||e); }
                }

                audit.athletes[name].source=source||'none';
                if(!pbRows||!pbRows.length){ audit.missing.push({athlete:name,type,error:'no results from any source'}); continue; }

                verified[type][name]={birth,wr};
                for(const [event,discipline] of Object.entries(eventMap[type])){
                  let candidates=pbRows.filter(r=>r.discipline===discipline && r.legal!==false && windApproved(event,r));
                  // Theoretical PB sums each event's best-ever mark, so a MISSING event silently
                  // drops out of that sum instead of contributing 0 - if the athlete's actual
                  // combined PB includes a wind-aided mark in this event (legitimate: combined-
                  // events scoring counts the mark regardless of wind, unlike standalone-event
                  // records/rankings), theoretical PB comes out lower than their real combined
                  // PB, producing >100% utilization and negative "unused potential". Confirmed
                  // for Devon Williams / Tristan Marcy (Lengde/Long Jump, both wind-aided-only).
                  // Fall back to the best available mark regardless of wind only when no
                  // wind-legal candidate exists at all.
                  let windAidedFallback=false;
                  if(!candidates.length){
                    const anyLegal=pbRows.filter(r=>r.discipline===discipline && r.legal!==false);
                    if(anyLegal.length){ candidates=anyLegal; windAidedFallback=true; }
                  }
                  let row=candidates[0]||null;
                  if(candidates.length>1){
                    const lower=['100m','400m','110mh','1500m','100mh','200m','800m'].includes(event);
                    row=[...candidates].sort((a,b)=>lower?value(event,a.mark)-value(event,b.mark):value(event,b.mark)-value(event,a.mark))[0];
                  }
                  if(!row){ audit.athletes[name].events[event]='MISSING'; continue; }
                  const wa=value(event,row.mark);
                  verified[type][name][event]={display:String(row.mark),mark:wa,points:score(type,event,wa),venue:venue(row),date:isoDate(row)};
                  audit.athletes[name].events[event]=windAidedFallback?'OK (wind-aided fallback)':'OK';
                }
                await sleep(80);
              }
            }

            let js=`// AUTO-GENERATED by .github/workflows/decastar-pb-bulk.yml\n// Exact senior disciplines only. Wind-dependent outdoor PBs are wind-approved.\n(function(){\n const R=window.MANGEKAMP_DATA; if(!R)return;\n const V=${JSON.stringify(verified)};\n for(const type of ['men','women']){\n  const list=R[type]?.decastar; if(!list)continue;\n  for(const a of list){\n   const v=V[type][a.name]; if(!v)continue;\n   if(v.birth) a.birth=v.birth;\n   if(v.wr!=null) a.wr=v.wr;\n   let theoretical=0,count=0;\n   for(const [e,p] of Object.entries(v)){ if(e==='birth'||e==='wr')continue; if(a.bests) a.bests[e]=p; theoretical+=Number(p.points)||0; count++; }\n   if(count>0){ a.theoretical=theoretical; a.theoreticalPB=theoretical; a.potential=theoretical-(Number(a.pb)||0); a.utilization=Number(a.pb)?Math.round((Number(a.pb)/theoretical)*1000)/10:0; }\n  }\n }\n})();\n`;
            fs.writeFileSync('app/data/decastar_pb_audit.json',JSON.stringify(audit,null,2));
            fs.writeFileSync('app/data/decastar_pb_verified.js',js);
            console.log('DONE men='+roster.men.length+' women='+roster.women.length+' missing='+audit.missing.length);
            if(audit.missing.length) console.log('MISSING '+JSON.stringify(audit.missing));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit verified Décastar data to a branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # decastar_pb_verified.js's <script> tag has no cache-busting query string of its own
          # otherwise, so a browser/CDN can keep serving a stale copy after this file changes
          # (confirmed live: a user saw pre-fix utilization numbers well after the fix had merged).
          sed -i -E "s#(data/decastar_pb_verified\.js\?v=)[^\"]*#\1$(date +%Y%m%d%H%M%S)#" app/index.html
          git add app/data/decastar_pb_audit.json app/data/decastar_pb_verified.js app/index.html
          git diff --cached --quiet && exit 0
          BRANCH="decastar-pb-audit-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m 'Audit Décastar Talence 2026 senior wind-legal PBs from WA profiles'
          git push -u origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Open pull request
        if: always() && env.BRANCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title 'Audit Décastar Talence 2026 senior wind-legal PBs' \
            --body 'Auto-generated by decastar-pb-bulk.yml. Review app/data/decastar_pb_audit.json for any MISSING entries before merging.'
